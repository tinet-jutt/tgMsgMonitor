                <div class="relative">
                  <input type="number" x-model.number="todoForm.offsetDays" min="1" max="3650" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono">
                  <span class="absolute right-3 top-2 text-xs text-gray-500" x-text="lang === 'zh' ? '天' : 'days'"></span>
                </div>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_offset_time')"></label>
                <input type="time" x-model="todoForm.offsetTime" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono">
              </div>
            </div>

            <!-- 快捷天数点击气泡 -->
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[11px] text-gray-500 mr-1" x-text="lang === 'zh' ? '快捷推算:' : 'Quick:'"></span>
              <button type="button" @click="todoForm.offsetDays = 1" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+1 天</button>
              <button type="button" @click="todoForm.offsetDays = 3" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+3 天</button>
              <button type="button" @click="todoForm.offsetDays = 7" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+7 天 (1周)</button>
              <button type="button" @click="todoForm.offsetDays = 15" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+15 天 (半月)</button>
              <button type="button" @click="todoForm.offsetDays = 30" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+30 天 (1月)</button>
              <button type="button" @click="todoForm.offsetDays = 90" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+90 天 (1季)</button>
              <button type="button" @click="todoForm.offsetDays = 365" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+365 天 (1年)</button>
            </div>

            <!-- 动态推算结果展示横幅 -->
            <div class="p-2.5 bg-indigo-500/10 border border-indigo-500/30 rounded-lg text-xs flex items-center justify-between">
              <div class="text-indigo-300 font-medium flex items-center space-x-1.5">
                <i data-lucide="calculator" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span x-text="t('lbl_calc_target')"></span>
              </div>
              <span class="text-white font-mono font-bold" x-text="computeOffsetTarget()"></span>
            </div>
          </div>

          <!-- 模式 2：指定具体日期时间 -->
          <div x-show="todoForm.dateMode === 'exact_datetime'" class="space-y-3 pt-2">
            <div>
              <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_exact_datetime')"></label>
              <input type="datetime-local" x-model="todoForm.exactDateTime" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono">
            </div>
            <!-- 快捷日期选择 -->
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[11px] text-gray-500 mr-1" x-text="lang === 'zh' ? '快速设定:' : 'Quick:'"></span>
              <button type="button" @click="setQuickExactDate(1)" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+1 天</button>
              <button type="button" @click="setQuickExactDate(3)" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+3 天</button>
              <button type="button" @click="setQuickExactDate(7)" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+7 天</button>
              <button type="button" @click="setQuickExactDate(30)" class="px-2 py-0.5 bg-brand-card hover:bg-brand-border border border-brand-border rounded text-[11px] text-gray-300 transition">+30 天</button>
            </div>
          </div>
        </div>

        <!-- 执行模式 (单次 vs 循环) -->
        <div class="p-4 bg-brand-dark/60 rounded-xl border border-brand-border space-y-3">
          <label class="block text-xs font-semibold text-purple-400 uppercase tracking-wider" x-text="t('lbl_exec_mode')"></label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center space-x-2.5 p-2.5 bg-brand-card border rounded-lg cursor-pointer transition"
                   :class="!todoForm.is_recurring ? 'border-purple-500 bg-purple-500/10 text-white' : 'border-brand-border text-gray-400'">
              <input type="radio" :value="false" x-model="todoForm.is_recurring" class="text-purple-600 focus:ring-0">
              <div class="flex items-center space-x-1.5 text-xs font-semibold">
                <i data-lucide="zap" class="w-3.5 h-3.5 text-purple-400"></i>
                <span x-text="t('mode_once')"></span>
              </div>
            </label>
            <label class="flex items-center space-x-2.5 p-2.5 bg-brand-card border rounded-lg cursor-pointer transition"
                   :class="todoForm.is_recurring ? 'border-purple-500 bg-purple-500/10 text-white' : 'border-brand-border text-gray-400'">
              <input type="radio" :value="true" x-model="todoForm.is_recurring" class="text-purple-600 focus:ring-0">
              <div class="flex items-center space-x-1.5 text-xs font-semibold">
                <i data-lucide="repeat" class="w-3.5 h-3.5 text-purple-400"></i>
                <span x-text="t('mode_recurring')"></span>
              </div>
            </label>
          </div>

          <div x-show="todoForm.is_recurring" class="pt-2">
            <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_repeat_interval')"></label>
            <div class="grid grid-cols-2 gap-3">
              <input type="number" x-model.number="todoForm.repeat_interval_value" min="1" max="999" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-purple-500 focus:outline-none rounded-lg text-sm text-white font-mono">
              <select x-model="todoForm.repeat_interval_unit" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-purple-500 focus:outline-none rounded-lg text-sm text-white">
                <option value="minutes" x-text="t('unit_minutes')"></option>
                <option value="hours" x-text="t('unit_hours')"></option>
                <option value="days" x-text="t('unit_days')"></option>
                <option value="weeks" x-text="t('unit_weeks')"></option>
                <option value="months" x-text="t('unit_months')"></option>
              </select>
            </div>
          </div>
        </div>

        <!-- 确认方式 (自动确认 vs 手动确认) -->
        <div class="p-4 bg-brand-dark/60 rounded-xl border border-brand-border space-y-3">
          <label class="block text-xs font-semibold text-amber-400 uppercase tracking-wider" x-text="t('lbl_confirm_mode')"></label>
          <div class="space-y-2">
            <label class="flex items-start space-x-2.5 p-3 bg-brand-card border rounded-lg cursor-pointer transition"
                   :class="todoForm.confirm_type === 'auto' ? 'border-amber-500 bg-amber-500/10 text-white' : 'border-brand-border text-gray-400'">
              <input type="radio" value="auto" x-model="todoForm.confirm_type" class="text-amber-600 focus:ring-0 mt-0.5">
              <div class="flex items-center space-x-1.5 text-xs font-semibold">
                <i data-lucide="bot" class="w-3.5 h-3.5 text-teal-400 shrink-0"></i>
                <span x-text="t('mode_auto_confirm')"></span>
              </div>
            </label>
            <label class="flex items-start space-x-2.5 p-3 bg-brand-card border rounded-lg cursor-pointer transition"
                   :class="todoForm.confirm_type === 'manual' ? 'border-amber-500 bg-amber-500/10 text-white' : 'border-brand-border text-gray-400'">
              <input type="radio" value="manual" x-model="todoForm.confirm_type" class="text-amber-600 focus:ring-0 mt-0.5">
              <div class="flex items-center space-x-1.5 text-xs font-semibold">
                <i data-lucide="hand" class="w-3.5 h-3.5 text-amber-400 shrink-0"></i>
                <span x-text="t('mode_manual_confirm')"></span>
              </div>
            </label>
          </div>

          <div x-show="todoForm.confirm_type === 'manual'" class="pt-2">
            <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_remind_interval')"></label>
            <div class="relative">
              <input type="number" x-model.number="todoForm.remind_interval_minutes" min="1" max="1440" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white font-mono">
              <span class="absolute right-3 top-2 text-xs text-gray-500" x-text="lang === 'zh' ? '分钟' : 'mins'"></span>
            </div>
            <p class="text-[11px] text-gray-500 mt-1" x-text="t('remind_interval_hint')"></p>
          </div>
        </div>

          <div x-show="todoForm.confirm_type === 'manual'" class="pt-2">
            <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_remind_interval')"></label>
            <div class="relative">
              <input type="number" x-model.number="todoForm.remind_interval_minutes" min="1" max="1440" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white font-mono">
              <span class="absolute right-3 top-2 text-xs text-gray-500" x-text="lang === 'zh' ? '分钟' : 'mins'"></span>
            </div>
            <p class="text-[11px] text-gray-500 mt-1" x-text="t('remind_interval_hint')"></p>
          </div>
        </div>

        <!-- 专属 Webhook 覆盖配置 -->
        <div class="p-4 bg-brand-dark/60 rounded-xl border border-brand-border space-y-3">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" x-model="todoForm.overrideWebhook" class="rounded bg-brand-dark border-brand-border text-indigo-600 focus:ring-0">
            <span class="text-xs font-semibold text-gray-300" x-text="t('lbl_todo_webhook_override')"></span>
          </label>

          <div x-show="todoForm.overrideWebhook" class="space-y-3 pt-2">
            <div>
              <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_dedicated_url')"></label>
              <input type="url" x-model="todoForm.webhookUrl" placeholder="https://api.example.com/todo-webhook?title={title}&date={date}" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_dedicated_method')"></label>
              <select x-model="todoForm.webhookMethod" class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
                <option value="" x-text="t('method_inherit')"></option>
                <option value="POST">POST</option>
                <option value="GET">GET</option>
              </select>
            </div>
            <div x-show="todoForm.webhookMethod === 'POST' || (!todoForm.webhookMethod && globalWebhook.method === 'POST')">
              <label class="block text-xs text-gray-400 mb-1" x-text="t('lbl_dedicated_body')"></label>
              <textarea x-model="todoForm.webhookCustomBody" rows="2" placeholder='{"title": "{title}", "content": "{content}", "due_date": "{due_date}"}' class="w-full px-3 py-2 bg-brand-card border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-xs text-white font-mono"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部按纽 -->
      <div class="mt-6 flex items-center justify-end space-x-3 pt-3 border-t border-brand-border">
        <button type="button" @click="closeTodoModal()" class="px-4 py-2 bg-brand-border hover:bg-brand-border/80 text-gray-300 rounded-xl text-xs font-semibold transition" x-text="t('btn_cancel')"></button>
        <button type="button" @click="saveTodo()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-500/20 flex items-center space-x-1.5">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span x-text="t('btn_save_todo')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- 模态框：重置并重新激活待办 -->
  <div x-show="showResetTodoModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" @click.self="showResetTodoModal = false">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-sm p-6 shadow-2xl relative" @click.stop>
      <button type="button" @click="showResetTodoModal = false" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h3 class="text-md font-bold text-white mb-2 flex items-center space-x-2">
        <i data-lucide="rotate-ccw" class="w-5 h-5 text-indigo-400"></i>
        <span x-text="t('modal_reset_title')"></span>
      </h3>
      <p class="text-xs text-gray-400 mb-4" x-text="lang === 'zh' ? '将已完成的待办任务重新激活并调度至新的目标时间。' : 'Reactivate this completed todo and schedule to a new target time.'"></p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2" x-text="t('lbl_reset_target')"></label>
          <input type="datetime-local" x-model="resetTargetDate" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono">
        </div>
        <button type="button" @click="confirmResetTodo()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition font-semibold text-sm flex items-center justify-center space-x-2 shadow-sm">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span x-text="t('btn_confirm_reset')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- 模态框：系统版本与在线更新 -->
  <div x-show="showUpdateModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm overflow-y-auto" @click.self="showUpdateModal = false">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-lg p-6 shadow-2xl relative my-8" @click.stop>
      <button type="button" @click="showUpdateModal = false" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center space-x-3 mb-4">
        <div class="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white" x-text="t('modal_update_title')"></h3>
          <p class="text-xs text-gray-400" x-text="t('modal_update_subtitle')"></p>
        </div>
      </div>

      <!-- 版本信息比对卡片 -->
      <div class="grid grid-cols-2 gap-3 mb-4 text-xs">
        <div class="p-3 bg-brand-dark/70 rounded-xl border border-brand-border space-y-1">
          <span class="text-gray-400" x-text="t('lbl_current_version') + ':'"></span>
          <div class="flex items-center space-x-1.5">
            <span class="text-sm font-bold text-white font-mono" x-text="systemVersion.version && systemVersion.version !== 'main' ? systemVersion.version : (systemVersion.commit_short || 'v1.2.0')"></span>
            <span class="px-1.5 py-0.5 rounded bg-brand-border text-gray-300 font-mono text-[11px]" x-text="systemVersion.commit_short"></span>
          </div>
        </div>
        <div class="p-3 bg-brand-dark/70 rounded-xl border border-brand-border space-y-1">
          <span class="text-gray-400" x-text="t('lbl_latest_remote') + ':'"></span>
          <div class="flex items-center space-x-1.5">
            <template x-if="checkingUpdate">
              <span class="text-xs text-indigo-400 font-medium" x-text="t('status_checking')"></span>
            </template>
            <template x-if="!checkingUpdate">
              <div class="flex items-center space-x-1.5">
                <span class="text-sm font-bold font-mono" :class="updateInfo.has_update ? 'text-amber-400' : 'text-emerald-400'" x-text="updateInfo.latest_commit_short || systemVersion.commit_short"></span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase"
                      :class="updateInfo.has_update ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'"
                      x-text="updateInfo.has_update ? t('tag_has_update') : t('tag_latest')"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- 检测中状态 -->
      <div x-show="checkingUpdate" class="py-8 text-center space-y-3">
        <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-xs text-gray-400" x-text="t('status_connecting_github')"></p>
      </div>

      <!-- 更新正在执行中状态 -->
      <div x-show="updatingSystem" class="py-6 text-center space-y-4 bg-indigo-500/5 rounded-xl border border-indigo-500/20 p-4 mb-4">
        <div class="w-10 h-10 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <div>
          <h4 class="text-sm font-bold text-white mb-1" x-text="t('status_updating_title')"></h4>
          <p class="text-xs text-gray-300 max-w-sm mx-auto" x-text="t('status_updating_desc')"></p>
        </div>
        <div class="text-[11px] text-indigo-400 font-mono" x-text="lang === 'zh' ? '正在探测服务重启就绪状态...' : 'Detecting service recovery...'"></div>
      </div>

      <!-- 检测结果详情展示 (非检测中 & 非更新中) -->
      <div x-show="!checkingUpdate && !updatingSystem" class="space-y-4">
        <!-- 发现新版本 -->
        <template x-if="updateInfo.has_update">
          <div class="space-y-3">
            <div class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-xl space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-amber-300 flex items-center space-x-1.5">
                  <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                  <span x-text="t('lbl_update_log')"></span>
                </span>
                <span class="text-[11px] text-gray-400 font-mono" x-text="updateInfo.commit_date"></span>
              </div>
              <div class="text-xs text-gray-200 bg-brand-dark/50 p-3 rounded-lg border border-brand-border font-sans whitespace-pre-wrap leading-relaxed" x-text="updateInfo.commit_message || '新版本功能优化与缺陷修复'"></div>
              <template x-if="updateInfo.commit_url">
                <div class="text-right">
                  <a :href="updateInfo.commit_url" target="_blank" class="text-[11px] text-indigo-400 hover:text-indigo-300 inline-flex items-center space-x-1 hover:underline">
                    <span>GitHub Commit</span>
                    <i data-lucide="external-link" class="w-3 h-3"></i>
                  </a>
                </div>
              </template>
            </div>

            <!-- 主动更新提示 -->
            <div class="p-3 bg-brand-dark/50 rounded-xl border border-brand-border text-xs text-gray-400 space-y-1">
              <div class="flex items-center space-x-1.5 text-gray-300 font-semibold">
                <i data-lucide="info" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span x-text="t('lbl_update_tip_title')"></span>
              </div>
              <p class="text-[11px]" x-text="t('lbl_update_tip_desc')"></p>
            </div>
          </div>
        </template>

        <!-- 当前已是最新版本 -->
        <template x-if="!updateInfo.has_update && !updateInfo.error">
          <div class="py-8 text-center space-y-2 border border-dashed border-brand-border rounded-xl">
            <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto mb-2">
              <i data-lucide="check-circle" class="w-5 h-5"></i>
            </div>
            <h4 class="text-sm font-bold text-white" x-text="t('msg_already_latest')"></h4>
            <p class="text-xs text-gray-400" x-text="t('lbl_last_checked') + ': ' + (updateInfo.check_time || '')"></p>
          </div>
        </template>

        <!-- 错误提示 -->
        <template x-if="updateInfo.error">
          <div class="p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-300 flex items-start space-x-2">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <span x-text="updateInfo.error"></span>
          </div>
        </template>
      </div>

      <!-- 底部按纽栏 -->
      <div class="mt-6 flex items-center justify-between pt-3 border-t border-brand-border">
        <button type="button" @click="checkSystemUpdate(true)" :disabled="checkingUpdate || updatingSystem" class="px-3.5 py-2 bg-brand-border hover:bg-brand-border/80 text-gray-300 rounded-xl text-xs font-semibold transition disabled:opacity-50 flex items-center space-x-1.5">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5" :class="checkingUpdate ? 'animate-spin' : ''"></i>
          <span x-text="t('btn_recheck_update')"></span>
        </button>

        <div class="flex items-center space-x-2">
          <button type="button" @click="showUpdateModal = false" class="px-4 py-2 bg-brand-border hover:bg-brand-border/80 text-gray-300 rounded-xl text-xs font-semibold transition" x-text="t('btn_cancel')"></button>
          
          <template x-if="updateInfo.has_update">
            <button type="button" @click="triggerSystemUpdate()" :disabled="updatingSystem" class="px-5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-500/20 flex items-center space-x-1.5 active:scale-95 disabled:opacity-50">
              <i data-lucide="rocket" class="w-4 h-4"></i>
              <span x-text="t('btn_start_update')"></span>
            </button>
          </template>
        </div>
      </div>

          if (this.todoFilter === 'pending_confirm') return this.todos.filter(t => t.status === 'pending_confirm');

        // --- 统一 API 请求代理 ---
        async apiFetch(url, options = {}) {
          options.headers = options.headers || {};
          const token = localStorage.getItem('admin_token');
          if (token) {
            options.headers['Authorization'] = `Bearer ${token}`;
          }
          
          if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
            options.headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(options.body);
          }
          
          const res = await fetch(url, options);
          if (res.status === 401) {
            localStorage.removeItem('admin_token');
            this.isLoggedIn = false;
            this.showToast("登录已过期或未授权，请重新登录", "error");
            throw new Error("Unauthorized");
          }
          return res;
        },

          if (!this.adminPasswordInput.trim()) {
            this.showToast("请输入密码", "error");
            return;
          }
          this.loggingIn = true;
          try {
            const res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ password: this.adminPasswordInput })
            });
            if (res.ok) {
              const data = await res.json();
              localStorage.setItem('admin_token', data.token);
              this.isLoggedIn = true;
              this.adminPasswordInput = "";
              this.showToast("身份验证成功！");
              this.refreshData();
            } else {
              const data = await res.json();
              this.showToast(data.detail || "密码验证失败", "error");

            this.showToast("验证请求异常: " + e, "error");

            this.loggingIn = false;

          this.loginError = "";
          try {

        async saveRule() {
          // 自动抓取未按回车就点击保存的临时输入
          if (this.tempKeyword && this.tempKeyword.trim()) {
            this.ruleForm.keywords.push(this.tempKeyword.trim());
            this.tempKeyword = "";
          }
          if (this.tempExcludeKeyword && this.tempExcludeKeyword.trim()) {
            this.ruleForm.exclude_keywords.push(this.tempExcludeKeyword.trim());
            this.tempExcludeKeyword = "";
          }
          if (this.tempExcludeSender && this.tempExcludeSender.trim()) {
            this.ruleForm.exclude_senders.push(this.tempExcludeSender.trim());
            this.tempExcludeSender = "";
          }

          if (!this.ruleForm.name.trim()) {
            this.showToast("请填写规则名称", "error");
            return;
          }

          if (this.ruleForm.filterMode === 'keywords' && this.ruleForm.keywords.length === 0 && this.ruleForm.exclude_keywords.length === 0 && this.ruleForm.exclude_senders.length === 0) {
            this.showToast(this.lang === 'zh' ? "在过滤模式下，请至少添加包含关键字、排除关键字或排除发送者" : "In filter mode, please add at least one keyword, exclude keyword, or excluded sender", "error");
            return;
          }

          // 提取 Targets
          const targets = this.ruleForm.targetsText
            .split("\n")
            .map(t => t.trim())
            .filter(t => t.length > 0);

          if (targets.length === 0) {
            this.showToast("至少输入一个监听目标", "error");
            return;
          }

          // 整理 Accounts 列表
          let ruleAccounts = ["all"];
          if (!this.ruleForm.bindAll) {
            if (this.ruleForm.accounts.length === 0) {
              this.showToast("至少勾选一个绑定的账号", "error");
              return;
            }
            ruleAccounts = [...this.ruleForm.accounts];
          }

          const payload = {
            id: this.ruleForm.id,
            name: this.ruleForm.name,
            accounts: ruleAccounts,
            targets: targets,
            filters: {
              keywords: this.ruleForm.filterMode === "all" ? [] : [...this.ruleForm.keywords],
              exclude_keywords: this.ruleForm.filterMode === "all" ? [] : [...this.ruleForm.exclude_keywords],
              exclude_senders: this.ruleForm.filterMode === "all" ? [] : [...this.ruleForm.exclude_senders],
              use_regex: this.ruleForm.use_regex
            },
            webhook: {
              url: this.ruleForm.overrideWebhook ? this.ruleForm.webhookUrl.trim() : "",
              method: this.ruleForm.overrideWebhook ? this.ruleForm.webhookMethod : "",
              custom_body: this.ruleForm.overrideWebhook ? this.ruleForm.webhookCustomBody : ""
            },
            debounce_seconds: parseInt(this.ruleForm.debounce_seconds || 0, 10),
            is_enabled: true
          };

          try {
            const url = this.ruleForm.isEdit ? `/api/rules/${this.ruleForm.id}` : "/api/rules";
            const method = this.ruleForm.isEdit ? "PUT" : "POST";
            
            const res = await this.apiFetch(url, {
              method: method,
              body: payload
            });

            if (res.ok) {
              this.showToast(this.ruleForm.isEdit ? "规则已成功修改并重载" : "监控规则创建成功，已重载配置");
              this.closeRuleModal();
              this.fetchRules();
            } else {
              const data = await res.json();
              this.showToast(data.detail || "保存失败", "error");
            }
          } catch (e) {
            this.showToast("网络请求异常", "error");
          }
        },

        formatDebounceHint(seconds) {
          if (!seconds || seconds <= 0) return "";
          const sec = parseInt(seconds, 10);
          if (isNaN(sec) || sec <= 0) return "";
          if (sec >= 3600 && sec % 3600 === 0) return `${sec / 3600} ${this.lang === 'zh' ? '小时' : 'h'}`;
          if (sec >= 60 && sec % 60 === 0) return `${sec / 60} ${this.lang === 'zh' ? '分钟' : 'min'}`;
          if (sec >= 60) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m} ${this.lang === 'zh' ? '分' : 'm'} ${s} ${this.lang === 'zh' ? '秒' : 's'}`;
          }
          return `${sec} ${this.lang === 'zh' ? '秒' : 's'}`;
        },

        // --- 测试 Webhook 发送 ---
        async testWebhook(type) {
          let url = "";
          let method = "POST";
          let custom_body = "";
          if (type === 'global') {
            url = this.globalWebhook.url;
            method = this.globalWebhook.method;
            custom_body = this.globalWebhook.custom_body;
          } else if (type === 'offline') {
            url = this.offlineWebhook.url || this.globalWebhook.url;
            method = this.offlineWebhook.method || this.globalWebhook.method;
            custom_body = this.offlineWebhook.custom_body;
          } else {
            url = this.ruleForm.webhookUrl;
            method = this.ruleForm.webhookMethod || this.globalWebhook.method;
            custom_body = this.ruleForm.webhookCustomBody;
          }

          if (!url) {
            this.showToast("请输入 Webhook URL 之后再进行测试", "error");
            return;
          }

          if (type === 'offline') {
            this.testingOfflineWebhook = true;
          } else {
            this.testingWebhook = true;
          }
          try {
            const res = await this.apiFetch("/api/webhook/test", {
              method: "POST",
              body: { url, method, custom_body }
            });
            const data = await res.json();
            this.testResult = {
              status: data.status,
              code: data.status_code,
              elapsed: data.elapsed_ms,
              response: data.response || "",
              error: data.error || ""
            };
            this.showTestResultModal = true;
          } catch (e) {
            this.showToast("请求测试 API 失败: " + e, "error");
          } finally {
            this.testingWebhook = false;
            this.testingOfflineWebhook = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        // --- 待办提醒函数与 API ---
        computeOffsetTarget() {
          const d = new Date();
          const days = parseInt(this.todoForm.offsetDays) || 0;
          d.setDate(d.getDate() + days);
          const timeParts = (this.todoForm.offsetTime || "10:00").split(":");
          const h = parseInt(timeParts[0]) || 0;
          const m = parseInt(timeParts[1]) || 0;
          d.setHours(h, m, 0, 0);

          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const date = String(d.getDate()).padStart(2, '0');
          const hour = String(d.getHours()).padStart(2, '0');
          const min = String(d.getMinutes()).padStart(2, '0');
          const sec = "00";
          return `${year}-${month}-${date} ${hour}:${min}:${sec}`;
        },

        setQuickExactDate(days) {
          const d = new Date();
          d.setDate(d.getDate() + days);
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const date = String(d.getDate()).padStart(2, '0');
          const hour = String(d.getHours()).padStart(2, '0');
          const min = String(d.getMinutes()).padStart(2, '0');
          this.todoForm.exactDateTime = `${year}-${month}-${date}T${hour}:${min}`;
        },

        formatUnitText(unit) {
          unit = (unit || 'days').toLowerCase();
          if (unit === 'minutes') return this.lang === 'zh' ? '分钟' : 'mins';
          if (unit === 'hours') return this.lang === 'zh' ? '小时' : 'hours';
          if (unit === 'days') return this.lang === 'zh' ? '天' : 'days';
          if (unit === 'weeks') return this.lang === 'zh' ? '周' : 'weeks';
          if (unit === 'months') return this.lang === 'zh' ? '个月' : 'months';
          return unit;
        },

        formatRemainingTime(todo) {
          if (todo.status === 'completed') {
            return (this.lang === 'zh' ? '已于 ' : 'Done at ') + (todo.completed_at || todo.target_date) + (this.lang === 'zh' ? ' 完成' : '');
          }
          if (todo.status === 'pending_confirm') {
            return (this.lang === 'zh' ? `待确认 (每 ${todo.remind_interval_minutes || 30} 分钟催办一次)` : `Pending Confirm (${todo.remind_interval_minutes || 30}m retry)`);
          }
          if (!todo.target_date) return '';
          
          const target = new Date(todo.target_date.replace(/-/g, '/'));
          if (isNaN(target.getTime())) return todo.target_date;
          
          const now = new Date();
          const diffMs = target.getTime() - now.getTime();
          
          if (diffMs < 0) {
            const totalHours = Math.floor(Math.abs(diffMs) / 3600000);
            const days = Math.floor(totalHours / 24);
            const hours = totalHours % 24;
            if (days > 0) {
              return this.lang === 'zh' ? `已到期 (逾期 ${days} 天 ${hours} 小时)` : `Due (${days}d ${hours}h ago)`;
            } else {
              return this.lang === 'zh' ? `已到期 (逾期 ${totalHours} 小时)` : `Due (${totalHours}h ago)`;
            }
          } else {
            const totalMins = Math.floor(diffMs / 60000);
            const totalHours = Math.floor(totalMins / 60);
            const days = Math.floor(totalHours / 24);
            const hours = totalHours % 24;
            const mins = totalMins % 60;
            if (days > 0) {
              return this.lang === 'zh' ? `还剩 ${days} 天 ${hours} 小时` : `Remaining ${days}d ${hours}h`;
            } else if (hours > 0) {
              return this.lang === 'zh' ? `还剩 ${hours} 小时 ${mins} 分钟` : `Remaining ${hours}h ${mins}m`;
            } else {
              return this.lang === 'zh' ? `还剩 ${mins} 分钟 (即将到期)` : `Remaining ${mins}m (Soon)`;
            }
          }
        },

        async fetchTodos() {
          try {
            const res = await this.apiFetch("/api/todos");
            this.todos = await res.json();
            this.$nextTick(() => lucide.createIcons());
          } catch(e) {}
        },

        async fetchTodosSilently() {
          try {
            const res = await this.apiFetch("/api/todos");
            this.todos = await res.json();
            this.$nextTick(() => lucide.createIcons());
          } catch(e) {}
        },

        openTodoModal(todo = null) {
          if (todo) {
            const isRecur = !!todo.is_recurring;
            const isManual = todo.confirm_type === 'manual';
            this.todoForm = {
              isEdit: true,
              id: todo.id,
              title: todo.title,
              content: todo.content || "",
              dateMode: "exact_datetime",
              offsetDays: 1,
              offsetTime: "10:00",
              exactDateTime: todo.target_date ? todo.target_date.replace(' ', 'T').substring(0, 16) : "",
              is_recurring: isRecur,
              repeat_interval_value: todo.repeat_interval_value || 1,
              repeat_interval_unit: todo.repeat_interval_unit || "days",
              confirm_type: isManual ? "manual" : "auto",
              remind_interval_minutes: todo.remind_interval_minutes || 30,
              overrideWebhook: !!(todo.webhook && todo.webhook.url),
              webhookUrl: (todo.webhook && todo.webhook.url) || "",
              webhookMethod: (todo.webhook && todo.webhook.method) || "",
              webhookCustomBody: (todo.webhook && todo.webhook.custom_body) || ""
            };
          } else {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            this.todoForm = {
              isEdit: false,
              id: "todo_" + Math.random().toString(36).substr(2, 9),
              title: "",
              content: "",
              dateMode: "offset_days",
              offsetDays: 1,
              offsetTime: `${h}:${m}`,
              exactDateTime: "",
              is_recurring: false,
              repeat_interval_value: 1,
              repeat_interval_unit: "days",
              confirm_type: "auto",
              remind_interval_minutes: 30,
              overrideWebhook: false,
              webhookUrl: "",
              webhookMethod: "",
              webhookCustomBody: ""
            };
            this.setQuickExactDate(1);
          }
          this.showTodoModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        closeTodoModal() {
          this.showTodoModal = false;
        },

        async saveTodo() {
          if (!this.todoForm.title || !this.todoForm.title.trim()) {
            this.showToast(this.lang === 'zh' ? "请填写待办标题" : "Please enter todo title", "error");
            return;
          }

          let finalTargetDate = "";
          if (this.todoForm.dateMode === 'offset_days') {
            finalTargetDate = this.computeOffsetTarget();
          } else {
            if (!this.todoForm.exactDateTime) {
              this.showToast(this.lang === 'zh' ? "请选择具体到期时间" : "Please select target datetime", "error");
              return;
            }
            finalTargetDate = this.todoForm.exactDateTime.replace('T', ' ');
            if (finalTargetDate.length === 16) {
              finalTargetDate += ":00";
            }
          }

          const payload = {
            id: this.todoForm.id,
            title: this.todoForm.title.trim(),
            content: (this.todoForm.content || "").trim(),
            target_date: finalTargetDate,
            is_recurring: this.todoForm.is_recurring,
            repeat_interval_value: parseInt(this.todoForm.repeat_interval_value) || 1,
            repeat_interval_unit: this.todoForm.repeat_interval_unit || "days",
            confirm_type: this.todoForm.confirm_type || "auto",
            remind_interval_minutes: parseInt(this.todoForm.remind_interval_minutes) || 30,
            webhook: {
              url: this.todoForm.overrideWebhook ? (this.todoForm.webhookUrl || "").trim() : "",
              method: this.todoForm.overrideWebhook ? this.todoForm.webhookMethod : "",
              custom_body: this.todoForm.overrideWebhook ? this.todoForm.webhookCustomBody : ""
            },
            is_enabled: true
          };

          try {
            const url = this.todoForm.isEdit ? `/api/todos/${this.todoForm.id}` : "/api/todos";
            const method = this.todoForm.isEdit ? "PUT" : "POST";
            const res = await this.apiFetch(url, {
              method: method,
              body: payload
            });

            if (res.ok) {
              this.showToast(this.todoForm.isEdit ? (this.lang === 'zh' ? "待办提醒已更新" : "Todo updated") : (this.lang === 'zh' ? "待办提醒创建成功" : "Todo created"));
              this.closeTodoModal();
              this.fetchTodos();
            } else {
              const data = await res.json();
              this.showToast(data.detail || "保存失败", "error");
            }
          } catch(e) {
            this.showToast("网络请求异常: " + e, "error");
          }
        },

        async deleteTodo(id) {
          try {
            const res = await this.apiFetch(`/api/todos/${id}`, { method: "DELETE" });
            if (res.ok) {
              this.showToast(this.lang === 'zh' ? "待办已删除" : "Todo deleted");
              this.fetchTodos();
            } else {
              this.showToast("删除失败", "error");
            }
          } catch(e) {
            this.showToast("网络请求异常", "error");
          }
        },

        async toggleTodo(id) {
          try {
            const res = await this.apiFetch(`/api/todos/${id}/toggle`, { method: "POST" });
            if (res.ok) {
              const data = await res.json();
              this.showToast(data.message);
              this.fetchTodos();
            }
          } catch(e) {
            this.showToast("网络请求异常", "error");
          }
        },

        async completeTodo(id) {
          try {
            const res = await this.apiFetch(`/api/todos/${id}/complete`, { method: "POST" });
            if (res.ok) {
              const data = await res.json();
              this.showToast(data.message);
              this.fetchTodos();
            } else {
              const data = await res.json();
              this.showToast(data.detail || "操作失败", "error");
            }
          } catch(e) {
            this.showToast("网络请求异常", "error");
          }
        },

        openResetTodoModal(todo) {
          this.resetTodoId = todo.id;
          const d = new Date();
          d.setDate(d.getDate() + 1);
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const date = String(d.getDate()).padStart(2, '0');
          const hour = String(d.getHours()).padStart(2, '0');
          const min = String(d.getMinutes()).padStart(2, '0');
          this.resetTargetDate = `${year}-${month}-${date}T${hour}:${min}`;
          this.showResetTodoModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async confirmResetTodo() {
          if (!this.resetTargetDate) {
            this.showToast(this.lang === 'zh' ? "请选择新的目标时间" : "Please select target time", "error");
            return;
          }
          let formattedDate = this.resetTargetDate.replace('T', ' ');
          if (formattedDate.length === 16) formattedDate += ":00";

          try {
            const res = await this.apiFetch(`/api/todos/${this.resetTodoId}/reset`, {
              method: "POST",
              body: { target_date: formattedDate }
            });
            if (res.ok) {
              const data = await res.json();
              this.showToast(data.message);
              this.showResetTodoModal = false;
              this.fetchTodos();
            }
          } catch(e) {
            this.showToast("网络请求异常", "error");
          }
        },

        async triggerTestTodo(id) {
          try {
            const res = await this.apiFetch(`/api/todos/${id}/trigger-test`, { method: "POST" });
            if (res.ok) {
              const data = await res.json();
              this.showToast(data.message);
            }
          } catch(e) {
            this.showToast("网络请求异常", "error");
          }
        },

        // --- 系统版本与在线更新函数 ---
        async fetchSystemVersion() {
          try {
            const res = await this.apiFetch("/api/system/version");
            if (res.ok) {
              this.systemVersion = await res.json();
              this.$nextTick(() => lucide.createIcons());
            }
          } catch(e) {}
        },

        async checkSystemUpdate(openModal = false) {
          this.checkingUpdate = true;
          if (openModal) {
            this.showUpdateModal = true;
          }
          try {
            const res = await this.apiFetch("/api/system/check-update");
            if (res.ok) {
              const data = await res.json();
              if (data.status === 'success') {
                this.updateInfo = data;
                this.hasNewUpdate = !!data.has_update;
                if (data.current_version) {
                  this.systemVersion.version = data.current_version;
                  this.systemVersion.commit_short = data.current_commit_short;
                }
              } else {
                this.updateInfo = {
                  has_update: false,
                  error: data.error || "未能获取版本信息"
                };
              }
            }
          } catch(e) {
            this.updateInfo = {
              has_update: false,
              error: "网络请求异常，无法连接更新服务"
            };
          } finally {
            this.checkingUpdate = false;
            this.$nextTick(() => lucide.createIcons());
          }
        },

        async triggerSystemUpdate() {
          this.updatingSystem = true;
          try {
            const res = await this.apiFetch("/api/system/trigger-update", { method: "POST" });
            const data = await res.json();
            if (data.status === 'success') {
              this.showToast(data.message);
              // 开始轮询服务重启恢复
              this.pollSystemOnlineAfterUpdate();
            } else if (data.status === 'manual_required') {
              this.updatingSystem = false;
              this.showToast(data.message, "info");
              if (data.command) {
                navigator.clipboard.writeText(data.command);
                this.showToast(this.lang === 'zh' ? "更新命令已复制到剪贴板" : "Update command copied to clipboard");
              }
            } else {
              this.updatingSystem = false;
              this.showToast(data.message || "更新触发失败", "error");
            }
          } catch(e) {
            // 容器可能在重启中导致连接断开，进入轮询
            this.pollSystemOnlineAfterUpdate();
          }
        },

        pollSystemOnlineAfterUpdate() {
          let retryCount = 0;
          const maxRetries = 30; // 最多探测 60 秒
          const interval = setInterval(async () => {
            retryCount++;
            try {
              const res = await fetch("/api/system/version", { cache: "no-cache" });
              if (res.status === 200 || res.status === 401) {
                clearInterval(interval);
                this.updatingSystem = false;
                this.showUpdateModal = false;
                this.showToast(this.lang === 'zh' ? "系统已更新完毕并恢复运行！" : "System updated successfully!");
                setTimeout(() => {
                  window.location.reload();
                }, 1000);
              }
            } catch(e) {
              // 仍处于重启离线中
            }
            if (retryCount >= maxRetries) {
              clearInterval(interval);
              this.updatingSystem = false;
              this.showToast(this.lang === 'zh' ? "更新服务响应超时，请手动刷新页面尝试" : "Update timeout, please refresh manually", "error");
            }
          }, 2000);
        }
      }
    }
  </script>
</body>
