              <i data-lucide="bell-ring" class="w-5 h-5 text-amber-400"></i>
              <h2 class="text-md font-bold text-white" x-text="t('card_offline_channels')"></h2>
            </div>
            <button type="button" @click="openHelpModal('tg')" class="px-2 py-1 text-[11px] bg-brand-border hover:bg-amber-600/20 text-amber-400 rounded transition flex items-center space-x-1" :title="t('modal_help_title')">
              <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
              <span x-text="lang === 'zh' ? '占位符说明' : 'Placeholders'"></span>
            </button>
          </div>

          <!-- 渠道切换 Tab (Webhook / Bark) -->
          <div class="flex items-center bg-brand-dark p-1 rounded-xl border border-brand-border text-xs">
            <button type="button" @click="offlineChannelTab = 'webhook'; $nextTick(() => lucide.createIcons());" :class="offlineChannelTab === 'webhook' ? 'bg-amber-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="flex-1 py-1.5 rounded-lg transition text-center flex items-center justify-center space-x-1.5">
              <i data-lucide="globe" class="w-3.5 h-3.5"></i>
              <span x-text="lang === 'zh' ? 'Webhook 告警' : 'Webhook Alert'"></span>
            </button>
            <button type="button" @click="offlineChannelTab = 'bark'; $nextTick(() => lucide.createIcons());" :class="offlineChannelTab === 'bark' ? 'bg-amber-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="flex-1 py-1.5 rounded-lg transition text-center flex items-center justify-center space-x-1.5">
              <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
              <span x-text="lang === 'zh' ? 'Bark 告警' : 'Bark Alert'"></span>
            </button>
          </div>
          
          <!-- 可用下线账号占位符快捷复制气泡栏 -->
          <div class="bg-brand-dark/40 border border-brand-border/60 rounded-lg p-2 text-xs">
            <span class="text-gray-400 font-medium mr-1.5" x-text="lang === 'zh' ? '支持下线账号占位符 (点击复制):' : 'Offline Placeholders (Click to copy):'"></span>
            <div class="inline-flex flex-wrap gap-1.5 mt-1">
              <button type="button" @click="copyPlaceholder('{phone}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '下线账号手机号' : 'Offline account phone'">
                {phone}
              </button>
              <button type="button" @click="copyPlaceholder('{reason}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '下线/失效原因' : 'Offline reason'">
                {reason}
              </button>
              <button type="button" @click="copyPlaceholder('{date}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '下线事件发生时间' : 'Offline datetime'">
                {date}
              </button>
              <button type="button" @click="copyPlaceholder('{text}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '默认整段下线告警文本' : 'Default offline alert text'">
                {text}
              </button>
            </div>
          </div>

          <!-- Webhook 告警表单 -->
          <div x-show="offlineChannelTab === 'webhook'" class="space-y-4 pt-1">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_url')"></label>
              <input type="url" x-model="offlineWebhook.url" placeholder="https://api.example.com/offline-webhook?phone={phone}&reason={reason}" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white font-mono transition">
              <p class="text-[11px] text-gray-500 mt-1" x-text="t('offline_webhook_hint')"></p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_method')"></label>
              <select x-model="offlineWebhook.method" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white transition bg-brand-dark">
                <option value="POST">POST (发送下线告警数据包)</option>
                <option value="GET">GET (参数拼接/URL占位符)</option>
              </select>
            </div>
            <div x-show="offlineWebhook.method === 'POST'">
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_custom_body')"></label>
              <textarea x-model="offlineWebhook.custom_body" rows="3" placeholder='{"event": "account_offline", "phone": "{phone}", "reason": "{reason}", "date": "{date}"}' class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-xs text-white font-mono"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4 pt-2">
              <button type="button" @click="testWebhook('offline')" :disabled="testingOfflineWebhook" class="py-2 bg-brand-border/60 hover:bg-brand-border text-white hover:text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                <i data-lucide="play" class="w-4 h-4 text-amber-400" x-show="!testingOfflineWebhook"></i>
                <span x-show="!testingOfflineWebhook" x-text="t('btn_test_conn')"></span>
                <span x-show="testingOfflineWebhook" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              </button>
              <button type="button" @click="saveOfflineWebhook()" class="py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span x-text="t('btn_save_config')"></span>
              </button>
            </div>
          </div>

          <!-- Bark 告警表单 -->
          <div x-show="offlineChannelTab === 'bark'" class="space-y-4 pt-1">
            <div class="flex items-center justify-between py-2 border-b border-brand-border/60">
              <div>
                <span class="text-xs font-semibold text-gray-200 block" x-text="lang === 'zh' ? '启用 Bark 离线告警' : 'Enable Offline Bark Alert'"></span>
                <span class="text-[11px] text-gray-500" x-text="lang === 'zh' ? '当账号离线/失效时立即向 Bark 发送时效性告警' : 'Push high-priority alert to Bark when TG account goes offline'"></span>
              </div>
              <button type="button" @click="offlineBark.is_enabled = !offlineBark.is_enabled" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none"
                      :class="offlineBark.is_enabled ? 'bg-amber-600' : 'bg-gray-700'">
                <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                     :class="offlineBark.is_enabled ? 'translate-x-4' : 'translate-x-0'"></div>
              </button>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_key')"></label>
              <input type="text" x-model="offlineBark.device_key" :placeholder="lang === 'zh' ? '留空则自动继承全局 Bark Key / URL' : 'Inherit Global Bark Key if empty...'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white font-mono transition">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_sound')"></label>
                <select x-model="offlineBark.sound" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-xs text-white transition bg-brand-dark">
                  <template x-for="s in barkSounds" :key="s.id">
                    <option :value="s.id" x-text="s.name"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_level')"></label>
                <select x-model="offlineBark.level" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-xs text-white transition bg-brand-dark">
                  <template x-for="lvl in barkLevels" :key="lvl.id">
                    <option :value="lvl.id" x-text="lvl.name"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_group')"></label>
                <input type="text" x-model="offlineBark.group" placeholder="账号告警" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white transition">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_server')"></label>
                <input type="url" x-model="offlineBark.server_url" placeholder="https://api.day.app" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-xs text-white font-mono transition">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
              <button type="button" @click="testBark('offline')" :disabled="testingOfflineBark" class="py-2 bg-brand-border/60 hover:bg-brand-border text-white hover:text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                <i data-lucide="play" class="w-4 h-4 text-amber-400" x-show="!testingOfflineBark"></i>
                <span x-show="!testingOfflineBark" x-text="lang === 'zh' ? '测试 Bark 告警' : 'Test Bark Alert'"></span>
                <span x-show="testingOfflineBark" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              </button>
              <button type="button" @click="saveOfflineBark()" :disabled="savingOfflineBark" class="py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                <i data-lucide="save" class="w-4 h-4" x-show="!savingOfflineBark"></i>
                <span x-show="!savingOfflineBark" x-text="t('btn_save_bark')"></span>
                <span x-show="savingOfflineBark" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右栏：监控规则 (2/3 宽度) -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl">
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
              <i data-lucide="shield-alert" class="w-5 h-5 text-indigo-400"></i>
              <h2 class="text-md font-bold text-white" x-text="t('card_rules')"></h2>
            </div>
            <button type="button" @click="openRuleModal()" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-md shadow-indigo-500/20 flex items-center space-x-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span x-text="t('btn_new_rule')"></span>
            </button>
          </div>

          <!-- 规则列表 -->
          <div class="space-y-6">
            <template x-if="rules.length === 0">
              <div class="text-center py-16 border border-dashed border-brand-border rounded-xl">
                <i data-lucide="alert-circle" class="w-10 h-10 text-gray-600 mx-auto mb-3"></i>
                <h3 class="text-sm font-semibold text-gray-400" x-text="lang === 'zh' ? '暂无监控规则' : 'No rules created'"></h3>
                <p class="text-xs text-gray-500 mt-1 max-w-sm mx-auto" x-text="lang === 'zh' ? '添加规则来设定需要监听哪些会话（群组、频道、机器人），以及需要筛选的关键字词汇。' : 'Add rules to specify which chats (groups, channels, bots) to monitor, and filters to match.'"></p>
              </div>
            </template>

            <template x-for="rule in rules" :key="rule.id">
              <div class="border border-brand-border hover:border-brand-border/80 rounded-xl p-5 bg-brand-dark/20 transition relative" :class="!rule.is_enabled ? 'opacity-60' : ''">
                <!-- 头部状态栏 -->
                <div class="flex items-start justify-between mb-4">
                  <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                      <span class="text-md font-bold text-white" x-text="rule.name"></span>
                      <span x-show="rule.filters.use_regex" class="inline-flex items-center justify-center text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 leading-none" x-text="t('rule_regex_active')"></span>
                    </div>
                    <!-- 绑定账号列表 -->
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="text-xs text-gray-500" x-text="lang === 'zh' ? '执行账号:' : 'Accounts:'"></span>
                      <template x-if="rule.accounts.includes('all') || rule.accounts.length === 0">
                        <span class="inline-flex items-center justify-center text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20 leading-none" x-text="lang === 'zh' ? '所有账号' : 'All accounts'"></span>
                      </template>
                      <template x-if="!rule.accounts.includes('all')">
                        <template x-for="p in rule.accounts" :key="p">
                          <span class="inline-flex items-center justify-center text-[10px] px-2 py-0.5 rounded-full bg-brand-border text-gray-300 font-medium leading-none" x-text="p"></span>
                        </template>
                      </template>
                    </div>
                  </div>
                  
                  <div class="flex items-center space-x-3">
                    <!-- Toggle 开关 -->
                    <button type="button" @click="toggleRule(rule.id)" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none"
                            :class="rule.is_enabled ? 'bg-indigo-600' : 'bg-gray-700'">
                      <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                           :class="rule.is_enabled ? 'translate-x-4' : 'translate-x-0'"></div>
                    </button>

                    <!-- 删除与编辑 -->
                    <div class="flex items-center space-x-1.5 border-l border-brand-border pl-3">
                      <button type="button" @click="openRuleModal(rule)" class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-brand-border transition" :title="t('btn_edit')">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      
                      <!-- 删除确认 -->
                      <div x-data="{ confirmDelete: false }" class="relative">
                        <button type="button" x-show="!confirmDelete" @click="confirmDelete = true" class="p-1.5 text-gray-400 hover:text-red-400 rounded-md hover:bg-red-500/10 transition" :title="t('btn_delete')">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <div x-show="confirmDelete" x-cloak class="flex items-center space-x-1 bg-brand-dark border border-red-500/30 rounded px-2 py-1 text-xs">
                          <span class="text-red-400" x-text="lang === 'zh' ? '确定?' : 'Sure?'"></span>
                          <button type="button" @click="deleteRule(rule.id)" class="text-emerald-400 font-bold hover:underline" x-text="lang === 'zh' ? '是' : 'Yes'"></button>
                          <button type="button" @click="confirmDelete = false" class="text-gray-400 hover:underline" x-text="lang === 'zh' ? '否' : 'No'"></button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 监控详情配置 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-brand-dark/40 p-4 rounded-lg border border-brand-border/40">
                  <div class="space-y-2">
                    <div>
                      <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                        <i data-lucide="target" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span x-text="lang === 'zh' ? '监听目标聊天 (Chats)' : 'Listen Target Chats'"></span>
                      </span>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="t in rule.targets" :key="t">
                          <span class="inline-flex items-center justify-center px-2 py-0.5 bg-brand-border rounded text-gray-300 font-semibold leading-none" x-text="t"></span>
                        </template>
                      </div>
                    </div>
                  </div>
                  
                  <div class="space-y-2">
                    <div>
                      <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                        <i data-lucide="filter" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span x-text="lang === 'zh' ? '匹配关键字 (Keywords)' : 'Matching Filters'"></span>
                      </span>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-if="rule.filters.keywords.length === 0 && (!rule.filters.exclude_keywords || rule.filters.exclude_keywords.length === 0) && (!rule.filters.exclude_senders || rule.filters.exclude_senders.length === 0)">
                          <span class="text-emerald-400 font-medium inline-flex items-center space-x-1 leading-none">
                            <i data-lucide="radio" class="w-3.5 h-3.5"></i>
                            <span x-text="lang === 'zh' ? '监听全部消息 (全量)' : 'Forwarding All Messages'"></span>
                          </span>
                        </template>
                        <template x-if="rule.filters.keywords.length === 0 && ((rule.filters.exclude_keywords && rule.filters.exclude_keywords.length > 0) || (rule.filters.exclude_senders && rule.filters.exclude_senders.length > 0))">
                          <span class="text-gray-400 font-medium leading-none" x-text="lang === 'zh' ? '未限制包含词 (仅条件过滤)' : 'Any message (conditional filter)'"></span>
                        </template>
                        <template x-for="kw in rule.filters.keywords" :key="kw">
                          <span class="inline-flex items-center justify-center px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/10 rounded font-semibold leading-none" x-text="kw"></span>
                        </template>
                      </div>
                    </div>
                    
                    <template x-if="rule.filters.exclude_keywords && rule.filters.exclude_keywords.length > 0">
                      <div class="mt-2">
                        <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                          <i data-lucide="ban" class="w-3.5 h-3.5 text-red-400"></i>
                          <span x-text="lang === 'zh' ? '排除关键字 (Blocklist)' : 'Exclude Keywords'"></span>
                        </span>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="ex in rule.filters.exclude_keywords" :key="ex">
                            <span class="inline-flex items-center justify-center px-2 py-0.5 bg-red-500/10 text-red-400 border border-red-500/10 rounded line-through leading-none" x-text="ex"></span>
                          </template>
                        </div>
                      </div>
                    </template>

                    <template x-if="rule.filters.exclude_senders && rule.filters.exclude_senders.length > 0">
                      <div class="mt-2">
                        <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                          <i data-lucide="user-x" class="w-3.5 h-3.5 text-amber-400"></i>
                          <span x-text="lang === 'zh' ? '排除发送者 (Blocked Senders)' : 'Exclude Senders'"></span>
                        </span>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="sender in rule.filters.exclude_senders" :key="sender">
                            <span class="inline-flex items-center justify-center px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/10 rounded font-mono text-xs line-through leading-none" x-text="sender.startsWith('@') || /^\d+$/.test(sender) ? sender : '@' + sender"></span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- 专属 Webhook 与 Bark 与防抖展示 -->
                <div class="mt-3 flex items-center justify-between text-xs text-gray-400 pl-1 flex-wrap gap-2">
                  <div class="flex items-center space-x-4 flex-wrap gap-y-1">
                    <div class="flex items-center space-x-1.5 truncate max-w-md">
                      <i data-lucide="link" class="w-3.5 h-3.5 text-gray-500"></i>
                      <span>Webhook:</span>
                      <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] uppercase font-bold leading-none shrink-0" x-text="rule.webhook.url ? (rule.webhook.method || 'POST') : (lang === 'zh' ? '继承全局' : 'Global')"></span>
                      <span class="truncate text-indigo-300 font-mono" x-text="rule.webhook.url || (lang === 'zh' ? '使用全局 Webhook URL' : 'Using Global Webhook')"></span>
                    </div>

                    <template x-if="rule.bark && rule.bark.is_enabled">
                      <div class="flex items-center space-x-1.5 truncate max-w-xs">
                        <i data-lucide="smartphone" class="w-3.5 h-3.5 text-purple-400"></i>
                        <span>Bark:</span>
                        <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 text-[10px] uppercase font-bold leading-none shrink-0" x-text="rule.bark.sound || (lang === 'zh' ? '默认铃声' : 'Default')"></span>
                        <span class="truncate text-purple-300 font-mono" x-text="rule.bark.device_key ? (lang === 'zh' ? '专属 Key' : 'Dedicated Key') : (lang === 'zh' ? '继承全局' : 'Global')"></span>
                      </div>
                    </template>
                  </div>

                  <template x-if="rule.debounce_seconds && rule.debounce_seconds > 0">
                    <span class="inline-flex items-center justify-center px-2 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 text-[11px] font-medium leading-none space-x-1" :title="lang === 'zh' ? '防抖冷却：触发一次后防抖期内不发送，新消息会重置防抖时间' : 'Debounce enabled'">
                      <i data-lucide="timer" class="w-3 h-3"></i>
                      <span x-text="(lang === 'zh' ? '防抖 ' : 'Debounce ') + formatDebounceHint(rule.debounce_seconds)"></span>
                    </span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>

    </div>

    <!-- Tab 2: 定时待办提醒面板 -->
    <div x-show="currentTab === 'scheduled_todos'" class="space-y-6" x-cloak>
      
      <!-- 待办控制台顶部统计卡片 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- 全部待办 -->
        <div @click="todoFilter = 'all'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-indigo-500/50" :class="todoFilter === 'all' ? 'border-indigo-500 bg-indigo-500/5 ring-1 ring-indigo-500/30' : 'border-brand-border'">
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400">
              <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" x-text="todos.length"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_all_todos')"></div>
        </div>

        <!-- 等待到期 -->
        <div @click="todoFilter = 'pending'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-blue-500/50" :class="todoFilter === 'pending' ? 'border-blue-500 bg-blue-500/5 ring-1 ring-blue-500/30' : 'border-brand-border'">
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-blue-500/10 text-blue-400">
              <i data-lucide="clock" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" x-text="todos.filter(t => t.status === 'pending' && t.is_enabled).length"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_pending_todos')"></div>
        </div>

        <!-- 待手动确认 (催办中) -->
        <div @click="todoFilter = 'pending_confirm'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-amber-500/50 relative overflow-hidden" :class="todoFilter === 'pending_confirm' ? 'border-amber-500 bg-amber-500/5 ring-1 ring-amber-500/30' : 'border-brand-border'">
          <template x-if="pendingConfirmCount > 0">
            <span class="absolute top-0 right-0 w-10 h-10 bg-amber-500/20 rounded-bl-full flex items-start justify-end p-1.5 text-amber-400">
              <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            </span>
          </template>
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-amber-500/10 text-amber-400">
              <i data-lucide="bell-ring" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" :class="pendingConfirmCount > 0 ? 'text-amber-400' : ''" x-text="pendingConfirmCount"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_confirming_todos')"></div>
        </div>

        <!-- 已完成 -->
        <div @click="todoFilter = 'completed'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-emerald-500/50" :class="todoFilter === 'completed' ? 'border-emerald-500 bg-emerald-500/5 ring-1 ring-emerald-500/30' : 'border-brand-border'">
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400">
              <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" x-text="todos.filter(t => t.status === 'completed').length"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_completed_todos')"></div>
        </div>
      </div>

      <!-- 待办控制台主体内容网格 (左侧：独立待办 Webhook，右侧：待办任务列表) -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        
        <!-- 左栏：定时待办默认通知渠道配置 (Webhook & Bark) (1/3 宽度) -->
        <div class="lg:col-span-1 space-y-6">
          <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex items-center justify-between mb-1">
              <div class="flex items-center space-x-2">
                <i data-lucide="bell" class="w-5 h-5 text-indigo-400"></i>
                <h2 class="text-md font-bold text-white" x-text="t('card_todo_channels')"></h2>
              </div>
              <button type="button" @click="openHelpModal('todo')" class="px-2 py-1 text-[11px] bg-brand-border hover:bg-indigo-600/20 text-indigo-400 rounded transition flex items-center space-x-1" :title="t('modal_help_title')">
                <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                <span x-text="lang === 'zh' ? '占位符说明' : 'Placeholders'"></span>
              </button>
            </div>

            <!-- 渠道切换 Tab (Webhook / Bark) -->
            <div class="flex items-center bg-brand-dark p-1 rounded-xl border border-brand-border text-xs">
              <button type="button" @click="todoChannelTab = 'webhook'; $nextTick(() => lucide.createIcons());" :class="todoChannelTab === 'webhook' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="flex-1 py-1.5 rounded-lg transition text-center flex items-center justify-center space-x-1.5">
                <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                <span x-text="t('channel_webhook')"></span>
              </button>
              <button type="button" @click="todoChannelTab = 'bark'; $nextTick(() => lucide.createIcons());" :class="todoChannelTab === 'bark' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="flex-1 py-1.5 rounded-lg transition text-center flex items-center justify-center space-x-1.5">
                <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
                <span x-text="t('channel_bark')"></span>
              </button>
            </div>

            <p class="text-xs text-gray-400" x-text="t('todo_webhook_hint')"></p>

            <!-- 可用待办占位符快捷复制气泡栏 -->
            <div class="bg-brand-dark/40 border border-brand-border/60 rounded-lg p-2 text-xs">
              <span class="text-gray-400 font-medium mr-1.5" x-text="lang === 'zh' ? '支持待办占位符 (点击复制):' : 'Todo Placeholders (Click to copy):'"></span>
              <div class="inline-flex flex-wrap gap-1.5 mt-1">
                <button type="button" @click="copyPlaceholder('{title}')" class="px-1.5 py-0.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-[11px] font-mono transition" title="待办标题">
                  {title}
                </button>
                <button type="button" @click="copyPlaceholder('{content}')" class="px-1.5 py-0.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-[11px] font-mono transition" title="待办详细内容">
                  {content}
                </button>
                <button type="button" @click="copyPlaceholder('{due_date}')" class="px-1.5 py-0.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-[11px] font-mono transition" title="目标到期时间">
                  {due_date}
                </button>
                <button type="button" @click="copyPlaceholder('{confirm_type}')" class="px-1.5 py-0.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-[11px] font-mono transition" title="确认方式">
                  {confirm_type}
                </button>
                <button type="button" @click="copyPlaceholder('{text}')" class="px-1.5 py-0.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-[11px] font-mono transition" title="默认待办通知文本">
                  {text}
                </button>
              </div>
            </div>

            <!-- Webhook 表单 -->
            <div x-show="todoChannelTab === 'webhook'" class="space-y-4 pt-1">
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_todo_default_url')"></label>
                <input type="url" x-model="todoWebhook.url" placeholder="https://api.example.com/todo-webhook?title={title}&date={due_date}" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm transition text-white font-mono">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_method')"></label>
                <select x-model="todoWebhook.method" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white transition bg-brand-dark">
                  <option value="POST">POST (发送待办提醒 JSON Body)</option>
                  <option value="GET">GET (参数拼接/URL占位符)</option>
                </select>
              </div>
              <div x-show="todoWebhook.method === 'POST'">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_custom_body')"></label>
                <textarea x-model="todoWebhook.custom_body" rows="3" placeholder='{"event": "todo_reminder", "title": "{title}", "content": "{content}", "due_date": "{due_date}"}' class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-xs text-white font-mono"></textarea>
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_timeout')"></label>
                <input type="number" x-model.number="todoWebhook.timeout" min="1" max="60" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white transition">
              </div>
              <div class="grid grid-cols-2 gap-4 pt-2">
                <button type="button" @click="testWebhook('todo')" :disabled="testingTodoWebhook" class="py-2 bg-brand-border/60 hover:bg-brand-border text-white hover:text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                  <i data-lucide="play" class="w-4 h-4 text-indigo-400" x-show="!testingTodoWebhook"></i>
                  <span x-show="!testingTodoWebhook" x-text="t('btn_test_conn')"></span>
                  <span x-show="testingTodoWebhook" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
                <button type="button" @click="saveTodoWebhook()" :disabled="savingTodoWebhook" class="py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                  <i data-lucide="save" class="w-4 h-4" x-show="!savingTodoWebhook"></i>
                  <span x-show="!savingTodoWebhook" x-text="t('btn_save_config')"></span>
                  <span x-show="savingTodoWebhook" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
              </div>
            </div>

            <!-- Bark 表单 -->
            <div x-show="todoChannelTab === 'bark'" class="space-y-4 pt-1">
              <div class="flex items-center justify-between py-2 border-b border-brand-border/60">
                <div>
                  <span class="text-xs font-semibold text-gray-200 block" x-text="lang === 'zh' ? '启用待办 Bark 默认提醒' : 'Enable Todo Default Bark Alert'"></span>
                  <span class="text-[11px] text-gray-500" x-text="lang === 'zh' ? '待办到期或催办时默认向 Bark 发送通知提醒' : 'Push alerts to Bark when scheduled todos are due'"></span>
                </div>
                <button type="button" @click="todoBark.is_enabled = !todoBark.is_enabled" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none"
                        :class="todoBark.is_enabled ? 'bg-indigo-600' : 'bg-gray-700'">
                  <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                       :class="todoBark.is_enabled ? 'translate-x-4' : 'translate-x-0'"></div>
                </button>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                  <span class="text-red-400 mr-1">*</span><span x-text="t('lbl_bark_key')"></span>
                </label>
                <input type="text" x-model="todoBark.device_key" :placeholder="lang === 'zh' ? '留空则自动继承全局 Bark Key / URL' : 'Inherit Global Bark Key if empty...'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono transition">
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_sound')"></label>
                  <select x-model="todoBark.sound" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-xs text-white transition bg-brand-dark">
                    <template x-for="s in barkSounds" :key="s.id">
                      <option :value="s.id" x-text="s.name"></option>
                    </template>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_level')"></label>
                  <select x-model="todoBark.level" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-xs text-white transition bg-brand-dark">
                    <template x-for="lvl in barkLevels" :key="lvl.id">
                      <option :value="lvl.id" x-text="lvl.name"></option>
                    </template>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_group')"></label>
                  <input type="text" x-model="todoBark.group" placeholder="定时待办" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white transition">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_server')"></label>
                  <input type="url" x-model="todoBark.server_url" placeholder="https://api.day.app" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-xs text-white font-mono transition">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bark_jump_url')"></label>
                <input type="text" x-model="todoBark.url" placeholder="https://..." class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono transition">
              </div>

              <div class="grid grid-cols-2 gap-4 pt-2">
                <button type="button" @click="testBark('todo')" :disabled="testingTodoBark" class="py-2 bg-brand-border/60 hover:bg-brand-border text-white hover:text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                  <i data-lucide="play" class="w-4 h-4 text-indigo-400" x-show="!testingTodoBark"></i>
                  <span x-show="!testingTodoBark" x-text="lang === 'zh' ? '测试待办 Bark' : 'Test Todo Bark'"></span>
                  <span x-show="testingTodoBark" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
                <button type="button" @click="saveTodoBark()" :disabled="savingTodoBark" class="py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                  <i data-lucide="save" class="w-4 h-4" x-show="!savingTodoBark"></i>
                  <span x-show="!savingTodoBark" x-text="t('btn_save_bark')"></span>
                  <span x-show="savingTodoBark" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 右栏：待办任务列表 (2/3 宽度) -->
        <div class="lg:col-span-2 space-y-6">
          <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl space-y-6">
        <div class="space-y-4">
          <!-- 头部标题与新建按钮 -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="flex items-center space-x-2">
                <i data-lucide="calendar-check" class="w-5 h-5 text-indigo-400"></i>
                <h2 class="text-lg font-bold text-white" x-text="t('card_todos')"></h2>
              </div>
              <p class="text-xs text-gray-400 mt-1" x-text="t('todo_desc')"></p>
            </div>

            <button type="button" @click="openTodoModal()" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-lg shadow-indigo-500/20 flex items-center space-x-2 shrink-0 whitespace-nowrap self-start sm:self-auto">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span x-text="t('btn_new_todo')"></span>
            </button>
          </div>

          <!-- 状态筛选标签栏 (横向滚动保护与防止换行挤压) -->
          <div class="flex items-center justify-between gap-3 pt-2 border-t border-brand-border/40">
            <div class="flex items-center bg-brand-dark p-1 rounded-xl border border-brand-border text-xs shrink-0 overflow-x-auto max-w-full">
              <button type="button" @click="todoFilter = 'all'" :class="todoFilter === 'all' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition whitespace-nowrap" x-text="t('filter_all')"></button>
              <button type="button" @click="todoFilter = 'pending'" :class="todoFilter === 'pending' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition whitespace-nowrap" x-text="t('filter_pending')"></button>
              <button type="button" @click="todoFilter = 'pending_confirm'" :class="todoFilter === 'pending_confirm' ? 'bg-amber-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition whitespace-nowrap" x-text="t('filter_confirming')"></button>
              <button type="button" @click="todoFilter = 'completed'" :class="todoFilter === 'completed' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition whitespace-nowrap" x-text="t('filter_completed')"></button>
            </div>
            
            <div class="text-xs text-gray-500 hidden md:block whitespace-nowrap">
              <span x-text="lang === 'zh' ? `共 ${filteredTodos.length} 项任务` : `${filteredTodos.length} todos`"></span>
            </div>
          </div>
        </div>

        <!-- 待办任务列表 -->
        <div class="space-y-4">
          <template x-if="filteredTodos.length === 0">
            <div class="text-center py-16 border border-dashed border-brand-border rounded-2xl">
              <div class="w-12 h-12 rounded-2xl bg-brand-dark/80 text-gray-500 flex items-center justify-center mx-auto mb-3 border border-brand-border">
                <i data-lucide="calendar-x-2" class="w-6 h-6"></i>
              </div>
              <h3 class="text-sm font-semibold text-gray-300" x-text="t('no_todos_title')"></h3>
              <p class="text-xs text-gray-500 mt-1 max-w-md mx-auto" x-text="t('no_todos_desc')"></p>
              <button type="button" @click="openTodoModal()" class="mt-4 px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 hover:text-indigo-300 border border-indigo-500/30 rounded-xl text-xs font-semibold transition inline-flex items-center space-x-1.5">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span x-text="t('btn_new_todo')"></span>
              </button>
            </div>
          </template>

          <template x-for="todo in filteredTodos" :key="todo.id">
            <div class="border rounded-2xl p-5 bg-brand-dark/30 transition-all space-y-4 relative"
                 :class="!todo.is_enabled ? 'opacity-60 border-brand-border' : todo.status === 'pending_confirm' ? 'border-amber-500/60 bg-amber-500/5 ring-1 ring-amber-500/20' : todo.status === 'completed' ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-brand-border hover:border-brand-border/90'">
              
              <!-- 顶部状态栏与标题 -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-2 min-w-0">
                  <!-- 状态徽章 -->
                  <template x-if="!todo.is_enabled">
                    <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-gray-500/10 text-gray-400 border border-gray-500/20 font-medium leading-none whitespace-nowrap">
                      <span class="w-1.5 h-1.5 rounded-full bg-gray-400 shrink-0"></span>
                      <span x-text="t('todo_status_disabled')" class="leading-none"></span>
                    </span>
                  </template>
                  <template x-if="todo.is_enabled && todo.status === 'completed'">
                    <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold leading-none whitespace-nowrap">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0"></span>
                      <span x-text="t('todo_status_completed')" class="leading-none"></span>
                    </span>
                  </template>
                  <template x-if="todo.is_enabled && todo.status === 'pending_confirm'">
                    <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold leading-none whitespace-nowrap animate-pulse">
                      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span>
                      <span x-text="t('todo_status_confirming')" class="leading-none"></span>
                    </span>
                  </template>
                  <template x-if="todo.is_enabled && todo.status === 'pending' && todo.is_overdue">
                    <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-semibold leading-none whitespace-nowrap">
                      <span class="w-1.5 h-1.5 rounded-full bg-rose-400 shrink-0"></span>
                      <span x-text="t('todo_status_overdue')" class="leading-none"></span>
                    </span>
                  </template>
                  <template x-if="todo.is_enabled && todo.status === 'pending' && !todo.is_overdue">
                    <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold leading-none whitespace-nowrap">
                      <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></span>
                      <span x-text="t('todo_status_pending')" class="leading-none"></span>
                    </span>
                  </template>

                  <!-- 执行模式徽章 -->
                  <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-md border font-medium font-mono leading-none whitespace-nowrap"
                        :class="todo.is_recurring ? 'bg-purple-500/10 text-purple-300 border-purple-500/30' : 'bg-slate-500/10 text-slate-300 border-slate-500/30'">
                    <i :data-lucide="todo.is_recurring ? 'repeat' : 'zap'" class="w-3.5 h-3.5 shrink-0"></i>
                    <span x-text="todo.is_recurring ? (lang === 'zh' ? `循环 (每 ${todo.repeat_interval_value} ${formatUnitText(todo.repeat_interval_unit)})` : `Recurring (${todo.repeat_interval_value} ${todo.repeat_interval_unit})`) : t('todo_tag_once')" class="leading-none"></span>
                  </span>

                  <!-- 确认方式徽章 -->
                  <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-md border font-medium leading-none whitespace-nowrap"
                        :class="todo.confirm_type === 'manual' ? 'bg-amber-500/10 text-amber-300 border-amber-500/30' : 'bg-teal-500/10 text-teal-300 border-teal-500/30'">
                    <i :data-lucide="todo.confirm_type === 'manual' ? 'hand' : 'bot'" class="w-3.5 h-3.5 shrink-0"></i>
                    <span x-text="todo.confirm_type === 'manual' ? (lang === 'zh' ? `手动确认 (催办每 ${todo.remind_interval_minutes}m)` : `Manual Confirm (${todo.remind_interval_minutes}m retry)`) : t('todo_tag_auto_confirm')" class="leading-none"></span>
                  </span>

                  <!-- 提前提醒徽章 (若配置了提前提醒) -->
                  <template x-if="todo.advance_value && todo.advance_value > 0">
                    <span class="inline-flex items-center justify-center gap-1.5 text-[11px] px-2.5 py-1 rounded-md border font-medium leading-none whitespace-nowrap bg-blue-500/10 text-blue-300 border-blue-500/30" :title="lang === 'zh' ? '已配置提前触发提醒通知' : 'Advance reminder enabled'">
                      <i data-lucide="alarm-clock" class="w-3.5 h-3.5 shrink-0 text-blue-400"></i>
                      <span x-text="lang === 'zh' ? `提前 ${todo.advance_value} ${formatUnitText(todo.advance_unit)}提醒` : `Advance ${todo.advance_value} ${formatUnitText(todo.advance_unit)}`" class="leading-none"></span>
                    </span>
                  </template>

                  <!-- 标题 -->
                  <h3 class="text-base font-bold text-white tracking-wide ml-1 truncate" x-text="todo.title"></h3>
                </div>

                <!-- 右侧操作栏 -->
                <div class="flex items-center space-x-2 shrink-0 self-start sm:self-auto">
                  <!-- 手动确认完成按钮 (仅在待确认状态或未完成时突出展示) -->
                  <template x-if="todo.status === 'pending_confirm'">
                    <button type="button" @click="completeTodo(todo.id)" class="px-3.5 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-lg text-xs font-bold transition inline-flex items-center justify-center space-x-1.5 shadow-lg shadow-emerald-600/30 active:scale-95 whitespace-nowrap shrink-0">
                      <i data-lucide="check" class="w-4 h-4 shrink-0"></i>
                      <span x-text="t('btn_complete_todo')" class="whitespace-nowrap leading-none"></span>
                    </button>
                  </template>

                  <!-- 已完成任务重置激活按纽 -->
                  <template x-if="todo.status === 'completed'">
                    <button type="button" @click="openResetTodoModal(todo)" class="px-3 py-1.5 bg-brand-border hover:bg-brand-border/80 text-indigo-400 hover:text-white rounded-lg text-xs font-medium transition inline-flex items-center justify-center space-x-1.5 whitespace-nowrap shrink-0" :title="t('btn_reactivate_todo')">
                      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 shrink-0"></i>
                      <span x-text="t('btn_reactivate_todo')" class="whitespace-nowrap leading-none"></span>
                    </button>
                  </template>

                  <!-- 启用/暂停 Toggle -->
                  <button type="button" @click="toggleTodo(todo.id)" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none shrink-0"
                          :class="todo.is_enabled ? 'bg-indigo-600' : 'bg-gray-700'" :title="todo.is_enabled ? t('rule_enabled') : t('rule_disabled')">
                    <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                         :class="todo.is_enabled ? 'translate-x-4' : 'translate-x-0'"></div>
                  </button>

                  <!-- 测试触发 Webhook 按钮 -->
                  <button type="button" @click="triggerTestTodo(todo.id)" class="p-1.5 text-gray-400 hover:text-indigo-300 rounded-md hover:bg-indigo-600/10 transition shrink-0" :title="t('btn_test_todo')">
                    <i data-lucide="play" class="w-4 h-4"></i>
                  </button>

                  <!-- 编辑按钮 -->
                  <button type="button" @click="openTodoModal(todo)" class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-brand-border transition shrink-0" :title="t('btn_edit')">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>

                  <!-- 删除确认按钮 -->
                  <div x-data="{ confirmDelete: false }" class="relative shrink-0">
                    <button type="button" x-show="!confirmDelete" @click="confirmDelete = true" class="p-1.5 text-gray-400 hover:text-red-400 rounded-md hover:bg-red-500/10 transition" :title="t('btn_delete')">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <div x-show="confirmDelete" x-cloak class="flex items-center space-x-1 bg-brand-dark border border-red-500/30 rounded px-2 py-1 text-xs">
                      <span class="text-red-400" x-text="lang === 'zh' ? '确定?' : 'Sure?'"></span>
                      <button type="button" @click="deleteTodo(todo.id)" class="text-emerald-400 font-bold hover:underline" x-text="lang === 'zh' ? '是' : 'Yes'"></button>
                      <button type="button" @click="confirmDelete = false" class="text-gray-400 hover:underline ml-1" x-text="lang === 'zh' ? '否' : 'No'"></button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 时间详情与剩余倒计时卡片 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-brand-dark/50 p-4 rounded-xl border border-brand-border/60">
                <!-- 目标时间与倒计时 -->
                <div class="space-y-1.5">
                  <div class="flex items-center space-x-2 text-gray-400">
                    <i data-lucide="calendar" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                    <span class="font-medium shrink-0" x-text="t('lbl_target_time') + ':'"></span>
                    <span class="text-white font-mono font-semibold" x-text="todo.target_date"></span>
                  </div>
                  <template x-if="todo.advance_value && todo.advance_value > 0 && todo.status === 'pending'">
                    <div class="flex items-center space-x-2 text-gray-400">
                      <i data-lucide="alarm-clock" class="w-4 h-4 text-blue-400 shrink-0"></i>
                      <span class="font-medium shrink-0" x-text="t('lbl_trigger_time') + ':'"></span>
                      <span class="text-blue-300 font-mono font-semibold" x-text="computeExpectedTriggerDate(todo.target_date, true, todo.advance_value, todo.advance_unit)"></span>
                    </div>
                  </template>
                  <div class="flex items-center space-x-2 text-gray-400">
                    <i data-lucide="hourglass" class="w-4 h-4 text-amber-400 shrink-0"></i>
                    <span class="font-medium shrink-0" x-text="t('lbl_remaining_time') + ':'"></span>
                    <span class="inline-flex items-center justify-center font-semibold text-xs px-2.5 py-1 rounded-md leading-none whitespace-nowrap"
                          :class="todo.status === 'completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : todo.status === 'pending_confirm' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : todo.is_overdue ? 'bg-rose-500/10 text-rose-300 border border-rose-500/20' : 'bg-blue-500/10 text-blue-300 border border-blue-500/20'"
                          x-text="formatRemainingTime(todo)"></span>
                  </div>
                </div>

                <!-- Webhook, Bark 与时间记录 -->
                <div class="space-y-1.5">
                  <div class="flex items-center space-x-2 text-gray-400 truncate">
                    <i data-lucide="link" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                    <span class="font-medium shrink-0">Webhook:</span>
                    <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] uppercase font-bold leading-none shrink-0" x-text="todo.webhook && todo.webhook.url ? (todo.webhook.method || 'POST') : (lang === 'zh' ? '待办默认' : 'Todo Default')"></span>
                    <span class="truncate text-indigo-300 font-mono" x-text="(todo.webhook && todo.webhook.url) ? todo.webhook.url : (todoWebhook.url || (lang === 'zh' ? '未配置待办默认 Webhook' : 'No Todo Webhook'))"></span>
                  </div>
                  <template x-if="todo.bark && todo.bark.is_enabled">
                    <div class="flex items-center space-x-2 text-gray-400 truncate">
                      <i data-lucide="smartphone" class="w-4 h-4 text-purple-400 shrink-0"></i>
                      <span class="font-medium shrink-0">Bark:</span>
                      <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 text-[10px] uppercase font-bold leading-none shrink-0" x-text="todo.bark.sound || (lang === 'zh' ? '默认铃声' : 'Default')"></span>
                      <span class="truncate text-purple-300 font-mono" x-text="todo.bark.device_key ? (lang === 'zh' ? '专属 Key' : 'Dedicated Key') : (todoBark.device_key || globalBark.device_key ? (lang === 'zh' ? '待办默认' : 'Todo Default') : (lang === 'zh' ? '未配置' : 'Not Configured'))"></span>
                    </div>
                  </template>
                  <div class="flex items-center space-x-4 text-gray-500 text-[11px]">
                    <span x-show="todo.created_at" x-text="t('lbl_created_at') + ': ' + todo.created_at"></span>
                    <span x-show="todo.last_trigger_time" x-text="t('lbl_last_trigger') + ': ' + todo.last_trigger_time"></span>
                    <span x-show="todo.completed_at && todo.status === 'completed'" class="text-emerald-400" x-text="t('lbl_completed_at') + ': ' + todo.completed_at"></span>
                  </div>
                </div>
              </div>

              <!-- 待办内容详情 -->
              <template x-if="todo.content && todo.content.trim()">
                <div class="text-xs text-gray-300 bg-brand-dark/30 p-3 rounded-lg border border-brand-border/40 whitespace-pre-wrap font-sans leading-relaxed" x-text="todo.content"></div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

    </div>

  </main>

  <!-- 模态框 1：Telegram 账号登录 -->
  <div x-show="showLoginModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" @click.self="closeLoginModal()">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <button type="button" @click="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-lg font-bold text-white mb-2 flex items-center space-x-2">
        <i data-lucide="send" class="w-5 h-5 text-indigo-400"></i>
        <span x-text="t('modal_login_title')"></span>
      </h3>
      <p class="text-xs text-gray-400 mb-6" x-text="lang === 'zh' ? '请输入 Telegram API 凭据进行交互式连接，登录凭据将加密保存在本地安全 Session 中。' : 'Please input Telegram API credentials for interactive authorization. Session will be securely stored in the local server.'"></p>

      <div class="space-y-4">
        <!-- 错误提示 -->
        <template x-if="loginError">
          <div class="p-3 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-xs" x-text="loginError"></div>
        </template>

        <!-- 阶段一：配置 API 凭证并发送验证码 -->
        <div x-show="loginStep === 1" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_phone')"></label>
            <input type="text" x-model="loginForm.phone" placeholder="+8613800000000" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">API ID</label>
              <input type="number" x-model.number="loginForm.api_id" placeholder="123456" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">API Hash</label>
              <input type="text" x-model="loginForm.api_hash" placeholder="your_hash" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
            </div>
          </div>
          <button type="button" @click="sendCode()" :disabled="submittingLogin" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg transition font-semibold text-sm flex items-center justify-center space-x-2">
            <span x-show="!submittingLogin" x-text="t('btn_get_code')"></span>
            <span x-show="submittingLogin" class="flex items-center space-x-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              <span x-text="lang === 'zh' ? '连接中...' : 'Connecting...'"></span>
            </span>
          </button>
        </div>

        <!-- 阶段二：输入验证码 -->
        <div x-show="loginStep === 2" class="space-y-4">
          <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-lg text-xs flex items-center space-x-2">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span x-text="lang === 'zh' ? '验证码已成功发往您的 Telegram 客户端。' : 'Verification code has been sent to your Telegram client.'"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_sms_code')"></label>
            <input type="text" x-model="loginForm.code" :placeholder="lang === 'zh' ? '输入验证码' : 'Enter SMS Code'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white tracking-widest text-center font-bold">
          </div>
          <button type="button" @click="verifyCode()" :disabled="submittingLogin" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg transition font-semibold text-sm flex items-center justify-center space-x-2">
            <span x-show="!submittingLogin" x-text="t('btn_verify_code')"></span>
            <span x-show="submittingLogin" class="flex items-center space-x-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              <span x-text="lang === 'zh' ? '验证中...' : 'Verifying...'"></span>
            </span>
          </button>
          <button type="button" @click="loginStep = 1; loginError = ''" class="w-full py-2 bg-transparent text-gray-400 hover:text-white rounded-lg text-xs transition" x-text="lang === 'zh' ? '返回上一步' : 'Go Back'"></button>
        </div>

        <!-- 阶段三：输入两步验证密码 -->
        <div x-show="loginStep === 3" class="space-y-4">
          <div class="p-3 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-lg text-xs flex items-center space-x-2">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <span x-text="lang === 'zh' ? '该账号已启用两步验证 (2FA)，请输入您的账户密码。' : 'This account has 2FA enabled. Please enter your two-step verification password.'"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_2fa_pwd')"></label>
            <input type="password" x-model="loginForm.password" :placeholder="lang === 'zh' ? '输入密码' : 'Enter 2FA Password'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
          </div>
          <button type="button" @click="verify2FA()" :disabled="submittingLogin" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg transition font-semibold text-sm flex items-center justify-center space-x-2">
            <span x-show="!submittingLogin" x-text="t('btn_verify_2fa')"></span>
            <span x-show="submittingLogin" class="flex items-center space-x-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              <span x-text="lang === 'zh' ? '验证中...' : 'Verifying...'"></span>
            </span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- 模态框 2：规则添加/编辑 -->
  <div x-show="showRuleModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" @click.self="closeRuleModal()">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button type="button" @click="closeRuleModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-lg font-bold text-white mb-6 flex items-center space-x-2">
        <i data-lucide="shield-alert" class="w-5 h-5 text-indigo-400"></i>
        <span x-text="ruleForm.isEdit ? (lang === 'zh' ? '编辑监控规则' : 'Edit Monitoring Rule') : (lang === 'zh' ? '创建监控规则' : 'Create Monitoring Rule')"></span>
      </h3>

      <div class="space-y-5">
        <!-- 规则名称 -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_rule_name')"></label>
          <input type="text" x-model="ruleForm.name" :placeholder="lang === 'zh' ? '例如: 招聘关键字监听' : 'e.g. Job Recruitment Monitor'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
        </div>

        <!-- 绑定执行账号 -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bind_accounts')"></label>
          <div class="flex flex-wrap gap-3 p-3 bg-brand-dark rounded-lg border border-brand-border">
            <label class="inline-flex items-center space-x-2 text-sm cursor-pointer">
              <input type="checkbox" x-model="ruleForm.bindAll" @change="handleBindAllChange()" class="rounded border-brand-border text-indigo-600 focus:ring-indigo-500 bg-brand-dark">
              <span class="text-indigo-400 font-semibold" x-text="t('lbl_bind_all')"></span>
            </label>
            <template x-for="acc in accounts" :key="acc.phone">
              <label class="inline-flex items-center space-x-2 text-sm cursor-pointer" x-show="!ruleForm.bindAll">
                <input type="checkbox" :value="acc.phone" x-model="ruleForm.accounts" class="rounded border-brand-border text-indigo-600 focus:ring-indigo-500 bg-brand-dark">
                <span x-text="acc.phone"></span>
              </label>
            </template>
          </div>
          <p class="text-[11px] text-gray-500 mt-1" x-text="lang === 'zh' ? '仅勾选的账号会在收到消息时应用此过滤规则。' : 'Only selected accounts will apply this filtering logic upon message arrival.'"></p>
        </div>

        <!-- 监听目标 chats -->
