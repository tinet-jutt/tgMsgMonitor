<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram 消息监控系统 - 管理后台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#090d16',
              card: '#121824',
              border: '#1f293d',
              accent: '#6366f1',
              accentHover: '#4f46e5'
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6366f1;
    }
  </style>
</head>
<body class="bg-brand-dark text-gray-100 antialiased" x-data="appState()">

  <!-- 管理员安全鉴权登录遮罩 -->
  <div x-show="!isLoggedIn" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center bg-brand-dark/95 backdrop-blur-md">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-sm p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-indigo-500/10 rounded-2xl text-indigo-400">
          <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-wide" x-text="t('auth_title')"></h1>
        <p class="text-xs text-gray-500" x-text="t('auth_subtitle')"></p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_admin_pwd')"></label>
          <input type="password" x-model="adminPasswordInput" @keydown.enter="loginAdmin()" :placeholder="t('ph_admin_pwd')" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white transition text-center tracking-widest">
        </div>
        <button type="button" @click="loginAdmin()" :disabled="loggingIn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
          <i data-lucide="key-round" class="w-4 h-4" x-show="!loggingIn"></i>
          <span x-show="!loggingIn" x-text="t('btn_login')"></span>
          <span x-show="loggingIn" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        </button>
      </div>
      <div class="text-center">
        <p class="text-[10px] text-gray-600" x-text="t('login_hint')"></p>
      </div>
    </div>
  </div>

  <!-- 页面顶部导航栏 -->
  <header class="border-b border-brand-border bg-brand-card/80 backdrop-blur-md sticky top-0 z-40" x-show="isLoggedIn" x-cloak>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg">
            <i data-lucide="eye" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-white tracking-wide" x-text="t('app_title')"></h1>
            <p class="text-xs text-gray-400" x-text="t('app_subtitle')"></p>
          </div>
        </div>

        <!-- 核心 Tab 切换栏 -->
        <nav class="hidden md:flex items-center space-x-1 bg-brand-dark/80 p-1 rounded-xl border border-brand-border">
          <button type="button" @click="currentTab = 'tg_monitor'" 
                  :class="currentTab === 'tg_monitor' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-brand-card'"
                  class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-2">
            <i data-lucide="radio" class="w-4 h-4"></i>
            <span x-text="t('tab_tg_monitor')"></span>
          </button>
          <button type="button" @click="currentTab = 'scheduled_todos'" 
                  :class="currentTab === 'scheduled_todos' ? 'bg-indigo-600 text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-brand-card'"
                  class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-2 relative">
            <i data-lucide="calendar-clock" class="w-4 h-4"></i>
            <span x-text="t('tab_scheduled_todos')"></span>
            <template x-if="pendingConfirmCount > 0">
              <span class="px-1.5 py-0.2 bg-red-500 text-white text-[10px] font-bold rounded-full animate-pulse" x-text="pendingConfirmCount"></span>
            </template>
          </button>
        </nav>
      </div>

      <div class="flex items-center space-x-4">
        <!-- 移动端 Tab 切换 -->
        <div class="flex md:hidden items-center space-x-1 bg-brand-dark p-1 rounded-lg border border-brand-border">
          <button type="button" @click="currentTab = 'tg_monitor'" :class="currentTab === 'tg_monitor' ? 'bg-indigo-600 text-white' : 'text-gray-400'" class="p-1.5 rounded-md text-xs">
            <i data-lucide="radio" class="w-4 h-4"></i>
          </button>
          <button type="button" @click="currentTab = 'scheduled_todos'" :class="currentTab === 'scheduled_todos' ? 'bg-indigo-600 text-white' : 'text-gray-400'" class="p-1.5 rounded-md text-xs relative">
            <i data-lucide="calendar-clock" class="w-4 h-4"></i>
            <template x-if="pendingConfirmCount > 0">
              <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
            </template>
          </button>
        </div>

        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center space-x-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span x-text="t('sys_online')"></span>
        </span>
        <!-- 版本与检查更新按钮 -->
        <button type="button" @click="checkSystemUpdate(true)" 
                class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 relative border"
                :class="hasNewUpdate ? 'bg-amber-500/10 border-amber-500/30 text-amber-300 hover:bg-amber-500/20 shadow-sm' : 'bg-brand-border/40 border-transparent hover:bg-brand-border hover:text-white text-gray-300'"
                :title="t('btn_check_update')">
          <i data-lucide="sparkles" class="w-3.5 h-3.5" :class="hasNewUpdate ? 'text-amber-400' : 'text-indigo-400'"></i>
          <span class="font-mono text-[11px]" x-text="systemVersion.version && systemVersion.version !== 'main' ? systemVersion.version : (systemVersion.commit_short ? '#' + systemVersion.commit_short : 'v1.2.0')"></span>
          <template x-if="hasNewUpdate">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 absolute -top-0.5 -right-0.5 shadow-sm"></span>
          </template>
        </button>
        <!-- 语言切换按钮 -->
        <button type="button" @click="toggleLanguage()" class="px-2.5 py-1.5 bg-brand-border/40 hover:bg-brand-border hover:text-white text-indigo-400 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5" title="Switch Language">
          <i data-lucide="globe" class="w-3.5 h-3.5"></i>
          <span x-text="lang === 'zh' ? 'English' : '简体中文'"></span>
        </button>
        <!-- 安全密码修改按钮 -->
        <button type="button" @click="showPwdModal = true" class="px-3 py-1.5 bg-brand-border/40 hover:bg-brand-border hover:text-white text-indigo-400 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5" :title="t('btn_pwd')">
          <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
          <span x-text="t('btn_pwd')"></span>
        </button>
        <button type="button" @click="refreshData()" :disabled="refreshing" class="p-2 text-gray-400 hover:text-white bg-brand-border/50 hover:bg-brand-border rounded-lg transition disabled:opacity-50 flex items-center justify-center" :title="t('btn_refresh')">
          <span :class="refreshing ? 'animate-spin block' : 'block'">
            <i data-lucide="rotate-cw" class="w-5 h-5"></i>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体区域 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" x-show="isLoggedIn" x-cloak>
    
    <!-- Tab 1: TG 消息监控面板 -->
    <div x-show="currentTab === 'tg_monitor'" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- 左栏：账号管理 (1/3 宽度) -->
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl">
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
              <i data-lucide="users" class="w-5 h-5 text-indigo-400"></i>
              <h2 class="text-md font-bold text-white" x-text="t('card_accounts')"></h2>
            </div>
            <button type="button" @click="openLoginModal()" class="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-md shadow-indigo-500/10 flex items-center space-x-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span x-text="t('btn_add_account')"></span>
            </button>
          </div>

          <!-- 账号列表 -->
          <div class="space-y-4">
            <template x-if="accounts.length === 0">
              <div class="text-center py-8 border border-dashed border-brand-border rounded-xl">
                <i data-lucide="user-minus" class="w-8 h-8 text-gray-600 mx-auto mb-2"></i>
                <p class="text-sm text-gray-500" x-text="lang === 'zh' ? '暂无关联 Telegram 账号' : 'No linked Telegram accounts'"></p>
                <p class="text-xs text-gray-600 mt-1" x-text="lang === 'zh' ? '点击“添加账号”启动监听' : 'Click Link Account to start monitoring'"></p>
              </div>
            </template>
            
            <template x-for="acc in accounts" :key="acc.phone">
              <div class="p-4 bg-brand-dark/50 border border-brand-border hover:border-brand-border/80 rounded-xl flex items-center justify-between transition group">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center" 
                       :class="acc.status === 'online' ? 'bg-emerald-500/10 text-emerald-400' : (acc.status === 'connecting' || acc.status === 'logging_in') ? 'bg-amber-500/10 text-amber-400' : 'bg-red-500/10 text-red-400'">
                    <i data-lucide="send" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <div class="text-sm font-semibold text-white" x-text="acc.phone"></div>
                    <div class="flex items-center space-x-1.5 mt-0.5">
                      <span class="w-1.5 h-1.5 rounded-full" 
                            :class="acc.status === 'online' ? 'bg-emerald-400' : (acc.status === 'connecting' || acc.status === 'logging_in') ? 'bg-amber-400 animate-pulse' : 'bg-red-400'"></span>
                      <span class="text-xs text-gray-400" 
                            x-text="acc.status === 'online' ? t('acc_status_online') : acc.status === 'connecting' ? t('acc_status_connecting') : acc.status === 'logging_in' ? t('acc_status_logging') : t('acc_status_offline')"></span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center space-x-2">
                  <!-- 删除账号确认 -->
                  <div x-data="{ confirmDelete: false }" class="relative">
                    <button type="button" x-show="!confirmDelete" @click="confirmDelete = true" class="p-1.5 text-gray-500 hover:text-red-400 rounded-md hover:bg-red-500/10 transition">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <div x-show="confirmDelete" x-cloak class="flex items-center space-x-1 bg-brand-dark border border-red-500/30 rounded px-1.5 py-0.5 text-[10px]">
                      <span class="text-red-400" x-text="lang === 'zh' ? '确定?' : 'Sure?'"></span>
                      <button type="button" @click="deleteAccount(acc.phone)" class="text-emerald-400 font-bold hover:underline" x-text="lang === 'zh' ? '是' : 'Yes'"></button>
                      <button type="button" @click="confirmDelete = false" class="text-gray-400 hover:underline ml-1" x-text="lang === 'zh' ? '否' : 'No'"></button>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 全局配置面板 -->
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl">
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
              <i data-lucide="settings" class="w-5 h-5 text-indigo-400"></i>
              <h2 class="text-md font-bold text-white" x-text="t('card_webhook')"></h2>
            </div>
            <!-- 帮助问号说明链接按钮 -->
            <button type="button" @click="showHelpModal = true" class="px-2 py-1 text-[11px] bg-brand-border hover:bg-indigo-600/20 text-indigo-400 rounded transition flex items-center space-x-1" :title="t('modal_help_title')">
              <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
              <span x-text="lang === 'zh' ? '占位符说明' : 'Placeholders'"></span>
            </button>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_url')"></label>
              <input type="url" x-model="globalWebhook.url" placeholder="https://api.example.com/webhook" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm transition">
              <p class="text-[11px] text-gray-500 mt-1" x-text="t('webhook_hint')"></p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_method')"></label>
              <select x-model="globalWebhook.method" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white transition bg-brand-dark">
                <option value="POST">POST (发送完整 JSON Body)</option>
                <option value="GET">GET (参数拼接/URL占位符)</option>
              </select>
            </div>
            <div x-show="globalWebhook.method === 'POST'">
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_custom_body')"></label>
              <textarea x-model="globalWebhook.custom_body" rows="3" placeholder='{"text": "{text}", "sender": "{sender_name}"}' class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-xs text-white font-mono"></textarea>
              <p class="text-[10px] text-gray-500 mt-1" x-text="t('custom_body_hint')"></p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_timeout')"></label>
              <input type="number" x-model.number="globalWebhook.timeout" min="1" max="60" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm transition">
            </div>
            <div class="grid grid-cols-2 gap-4">
              <button type="button" @click="testWebhook('global')" :disabled="testingWebhook" class="py-2 bg-brand-border/60 hover:bg-brand-border text-white hover:text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                <i data-lucide="play" class="w-4 h-4 text-indigo-400" x-show="!testingWebhook"></i>
                <span x-show="!testingWebhook" x-text="t('btn_test_conn')"></span>
                <span x-show="testingWebhook" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              </button>
              <button type="button" @click="saveGlobalWebhook()" class="py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span x-text="t('btn_save_config')"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- 账号下线告警 Webhook 配置 -->
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl space-y-4">
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center space-x-2">
              <i data-lucide="bell-ring" class="w-5 h-5 text-amber-400"></i>
              <h2 class="text-md font-bold text-white" x-text="t('card_offline_webhook')"></h2>
            </div>
            <button type="button" @click="showHelpModal = true" class="px-2 py-1 text-[11px] bg-brand-border hover:bg-amber-600/20 text-amber-400 rounded transition flex items-center space-x-1" :title="t('modal_help_title')">
              <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
              <span x-text="lang === 'zh' ? '占位符说明' : 'Placeholders'"></span>
            </button>
          </div>
          
          <!-- 可用下线账号占位符快捷复制气泡栏 -->
          <div class="bg-brand-dark/40 border border-brand-border/60 rounded-lg p-2 text-xs">
            <span class="text-gray-400 font-medium mr-1.5" x-text="lang === 'zh' ? '支持下线账号占位符 (点击复制):' : 'Offline Placeholders (Click to copy):'"></span>
            <div class="inline-flex flex-wrap gap-1.5 mt-1">
              <button type="button" @click="copyPlaceholder('{phone}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '下线账号手机号' : 'Offline account phone'">
                {phone}
              </button>
              <button type="button" @click="copyPlaceholder('{reason}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '下线/失效原因' : 'Offline reason'">
                {reason}
              </button>
              <button type="button" @click="copyPlaceholder('{date}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '下线事件发生时间' : 'Offline datetime'">
                {date}
              </button>
              <button type="button" @click="copyPlaceholder('{text}')" class="px-1.5 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded text-[11px] font-mono transition" :title="lang === 'zh' ? '默认整段下线告警文本' : 'Default offline alert text'">
                {text}
              </button>
            </div>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_url')"></label>
              <input type="url" x-model="offlineWebhook.url" placeholder="https://api.example.com/offline-webhook?phone={phone}&reason={reason}" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm transition">
              <p class="text-[11px] text-gray-500 mt-1" x-text="t('offline_webhook_hint')"></p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_webhook_method')"></label>
              <select x-model="offlineWebhook.method" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-sm text-white transition bg-brand-dark">
                <option value="POST">POST (发送下线告警数据包)</option>
                <option value="GET">GET (参数拼接/URL占位符)</option>
              </select>
            </div>
            <div x-show="offlineWebhook.method === 'POST'">
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_custom_body')"></label>
              <textarea x-model="offlineWebhook.custom_body" rows="3" placeholder='{"event": "account_offline", "phone": "{phone}", "reason": "{reason}", "date": "{date}"}' class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-amber-500 focus:outline-none rounded-lg text-xs text-white font-mono"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <button type="button" @click="testWebhook('offline')" :disabled="testingOfflineWebhook" class="py-2 bg-brand-border/60 hover:bg-brand-border text-white hover:text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm disabled:opacity-50">
                <i data-lucide="play" class="w-4 h-4 text-amber-400" x-show="!testingOfflineWebhook"></i>
                <span x-show="!testingOfflineWebhook" x-text="t('btn_test_conn')"></span>
                <span x-show="testingOfflineWebhook" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              </button>
              <button type="button" @click="saveOfflineWebhook()" class="py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition font-medium text-sm flex items-center justify-center space-x-2 shadow-sm">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span x-text="t('btn_save_config')"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右栏：监控规则 (2/3 宽度) -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl">
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-2">
              <i data-lucide="shield-alert" class="w-5 h-5 text-indigo-400"></i>
              <h2 class="text-md font-bold text-white" x-text="t('card_rules')"></h2>
            </div>
            <button type="button" @click="openRuleModal()" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-md shadow-indigo-500/20 flex items-center space-x-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span x-text="t('btn_new_rule')"></span>
            </button>
          </div>

          <!-- 规则列表 -->
          <div class="space-y-6">
            <template x-if="rules.length === 0">
              <div class="text-center py-16 border border-dashed border-brand-border rounded-xl">
                <i data-lucide="alert-circle" class="w-10 h-10 text-gray-600 mx-auto mb-3"></i>
                <h3 class="text-sm font-semibold text-gray-400" x-text="lang === 'zh' ? '暂无监控规则' : 'No rules created'"></h3>
                <p class="text-xs text-gray-500 mt-1 max-w-sm mx-auto" x-text="lang === 'zh' ? '添加规则来设定需要监听哪些会话（群组、频道、机器人），以及需要筛选的关键字词汇。' : 'Add rules to specify which chats (groups, channels, bots) to monitor, and filters to match.'"></p>
              </div>
            </template>

            <template x-for="rule in rules" :key="rule.id">
              <div class="border border-brand-border hover:border-brand-border/80 rounded-xl p-5 bg-brand-dark/20 transition relative" :class="!rule.is_enabled ? 'opacity-60' : ''">
                <!-- 头部状态栏 -->
                <div class="flex items-start justify-between mb-4">
                  <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                      <span class="text-md font-bold text-white" x-text="rule.name"></span>
                      <span x-show="rule.filters.use_regex" class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20" x-text="t('rule_regex_active')"></span>
                    </div>
                    <!-- 绑定账号列表 -->
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="text-xs text-gray-500" x-text="lang === 'zh' ? '执行账号:' : 'Accounts:'"></span>
                      <template x-if="rule.accounts.includes('all') || rule.accounts.length === 0">
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20" x-text="lang === 'zh' ? '所有账号' : 'All accounts'"></span>
                      </template>
                      <template x-if="!rule.accounts.includes('all')">
                        <template x-for="p in rule.accounts" :key="p">
                          <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-border text-gray-300 font-medium" x-text="p"></span>
                        </template>
                      </template>
                    </div>
                  </div>
                  
                  <div class="flex items-center space-x-3">
                    <!-- Toggle 开关 -->
                    <button type="button" @click="toggleRule(rule.id)" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none"
                            :class="rule.is_enabled ? 'bg-indigo-600' : 'bg-gray-700'">
                      <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                           :class="rule.is_enabled ? 'translate-x-4' : 'translate-x-0'"></div>
                    </button>

                    <!-- 删除与编辑 -->
                    <div class="flex items-center space-x-1.5 border-l border-brand-border pl-3">
                      <button type="button" @click="openRuleModal(rule)" class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-brand-border transition" :title="t('btn_edit')">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      
                      <!-- 删除确认 -->
                      <div x-data="{ confirmDelete: false }" class="relative">
                        <button type="button" x-show="!confirmDelete" @click="confirmDelete = true" class="p-1.5 text-gray-400 hover:text-red-400 rounded-md hover:bg-red-500/10 transition" :title="t('btn_delete')">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                        <div x-show="confirmDelete" x-cloak class="flex items-center space-x-1 bg-brand-dark border border-red-500/30 rounded px-2 py-1 text-xs">
                          <span class="text-red-400" x-text="lang === 'zh' ? '确定?' : 'Sure?'"></span>
                          <button type="button" @click="deleteRule(rule.id)" class="text-emerald-400 font-bold hover:underline" x-text="lang === 'zh' ? '是' : 'Yes'"></button>
                          <button type="button" @click="confirmDelete = false" class="text-gray-400 hover:underline" x-text="lang === 'zh' ? '否' : 'No'"></button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 监控详情配置 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-brand-dark/40 p-4 rounded-lg border border-brand-border/40">
                  <div class="space-y-2">
                    <div>
                      <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                        <i data-lucide="target" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span x-text="lang === 'zh' ? '监听目标聊天 (Chats)' : 'Listen Target Chats'"></span>
                      </span>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="t in rule.targets" :key="t">
                          <span class="px-2 py-0.5 bg-brand-border rounded text-gray-300 font-semibold" x-text="t"></span>
                        </template>
                      </div>
                    </div>
                  </div>
                  
                  <div class="space-y-2">
                    <div>
                      <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                        <i data-lucide="filter" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span x-text="lang === 'zh' ? '匹配关键字 (Keywords)' : 'Matching Filters'"></span>
                      </span>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-if="rule.filters.keywords.length === 0 && (!rule.filters.exclude_keywords || rule.filters.exclude_keywords.length === 0) && (!rule.filters.exclude_senders || rule.filters.exclude_senders.length === 0)">
                          <span class="text-emerald-400 font-medium flex items-center space-x-1">
                            <i data-lucide="radio" class="w-3.5 h-3.5"></i>
                            <span x-text="lang === 'zh' ? '监听全部消息 (全量)' : 'Forwarding All Messages'"></span>
                          </span>
                        </template>
                        <template x-if="rule.filters.keywords.length === 0 && ((rule.filters.exclude_keywords && rule.filters.exclude_keywords.length > 0) || (rule.filters.exclude_senders && rule.filters.exclude_senders.length > 0))">
                          <span class="text-gray-400 font-medium" x-text="lang === 'zh' ? '未限制包含词 (仅条件过滤)' : 'Any message (conditional filter)'"></span>
                        </template>
                        <template x-for="kw in rule.filters.keywords" :key="kw">
                          <span class="px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/10 rounded font-semibold" x-text="kw"></span>
                        </template>
                      </div>
                    </div>
                    
                    <template x-if="rule.filters.exclude_keywords && rule.filters.exclude_keywords.length > 0">
                      <div class="mt-2">
                        <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                          <i data-lucide="ban" class="w-3.5 h-3.5 text-red-400"></i>
                          <span x-text="lang === 'zh' ? '排除关键字 (Blocklist)' : 'Exclude Keywords'"></span>
                        </span>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="ex in rule.filters.exclude_keywords" :key="ex">
                            <span class="px-2 py-0.5 bg-red-500/10 text-red-400 border border-red-500/10 rounded line-through" x-text="ex"></span>
                          </template>
                        </div>
                      </div>
                    </template>

                    <template x-if="rule.filters.exclude_senders && rule.filters.exclude_senders.length > 0">
                      <div class="mt-2">
                        <span class="text-gray-500 font-medium flex items-center space-x-1.5 mb-1.5">
                          <i data-lucide="user-x" class="w-3.5 h-3.5 text-amber-400"></i>
                          <span x-text="lang === 'zh' ? '排除发送者 (Blocked Senders)' : 'Exclude Senders'"></span>
                        </span>
                        <div class="flex flex-wrap gap-1.5">
                          <template x-for="sender in rule.filters.exclude_senders" :key="sender">
                            <span class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/10 rounded font-mono text-xs line-through" x-text="sender.startsWith('@') || /^\d+$/.test(sender) ? sender : '@' + sender"></span>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- 专属 Webhook 与防抖展示 -->
                <div class="mt-3 flex items-center justify-between text-xs text-gray-400 pl-1 flex-wrap gap-2">
                  <div class="flex items-center space-x-1.5 truncate max-w-md">
                    <i data-lucide="link" class="w-3.5 h-3.5 text-gray-500"></i>
                    <span>Webhook:</span>
                    <span class="px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] uppercase font-bold" x-text="rule.webhook.url ? (rule.webhook.method || 'POST') : (lang === 'zh' ? '继承全局' : 'Global')"></span>
                    <span class="truncate text-indigo-300 font-mono" x-text="rule.webhook.url || (lang === 'zh' ? '使用全局 Webhook URL' : 'Using Global Webhook')"></span>
                  </div>
                  <template x-if="rule.debounce_seconds && rule.debounce_seconds > 0">
                    <span class="px-2 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 text-[11px] font-medium flex items-center space-x-1" :title="lang === 'zh' ? '防抖冷却：触发一次后防抖期内不发送，新消息会重置防抖时间' : 'Debounce enabled'">
                      <i data-lucide="timer" class="w-3 h-3"></i>
                      <span x-text="(lang === 'zh' ? '防抖 ' : 'Debounce ') + formatDebounceHint(rule.debounce_seconds)"></span>
                    </span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>

    </div>

    <!-- Tab 2: 定时待办提醒面板 -->
    <div x-show="currentTab === 'scheduled_todos'" class="space-y-6" x-cloak>
      
      <!-- 待办控制台顶部统计卡片 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- 全部待办 -->
        <div @click="todoFilter = 'all'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-indigo-500/50" :class="todoFilter === 'all' ? 'border-indigo-500 bg-indigo-500/5 ring-1 ring-indigo-500/30' : 'border-brand-border'">
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400">
              <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" x-text="todos.length"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_all_todos')"></div>
        </div>

        <!-- 等待到期 -->
        <div @click="todoFilter = 'pending'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-blue-500/50" :class="todoFilter === 'pending' ? 'border-blue-500 bg-blue-500/5 ring-1 ring-blue-500/30' : 'border-brand-border'">
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-blue-500/10 text-blue-400">
              <i data-lucide="clock" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" x-text="todos.filter(t => t.status === 'pending' && t.is_enabled).length"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_pending_todos')"></div>
        </div>

        <!-- 待手动确认 (催办中) -->
        <div @click="todoFilter = 'pending_confirm'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-amber-500/50 relative overflow-hidden" :class="todoFilter === 'pending_confirm' ? 'border-amber-500 bg-amber-500/5 ring-1 ring-amber-500/30' : 'border-brand-border'">
          <template x-if="pendingConfirmCount > 0">
            <span class="absolute top-0 right-0 w-10 h-10 bg-amber-500/20 rounded-bl-full flex items-start justify-end p-1.5 text-amber-400">
              <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            </span>
          </template>
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-amber-500/10 text-amber-400">
              <i data-lucide="bell-ring" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" :class="pendingConfirmCount > 0 ? 'text-amber-400' : ''" x-text="pendingConfirmCount"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_confirming_todos')"></div>
        </div>

        <!-- 已完成 -->
        <div @click="todoFilter = 'completed'" class="p-5 bg-brand-card border rounded-2xl cursor-pointer transition shadow-lg hover:border-emerald-500/50" :class="todoFilter === 'completed' ? 'border-emerald-500 bg-emerald-500/5 ring-1 ring-emerald-500/30' : 'border-brand-border'">
          <div class="flex items-center justify-between">
            <div class="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400">
              <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            </div>
            <span class="text-2xl font-bold text-white font-mono" x-text="todos.filter(t => t.status === 'completed').length"></span>
          </div>
          <div class="mt-3 text-xs font-semibold text-gray-400 uppercase tracking-wider" x-text="t('stat_completed_todos')"></div>
        </div>
      </div>

      <!-- 操作与筛选栏 -->
      <div class="bg-brand-card border border-brand-border rounded-2xl p-6 shadow-xl space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center space-x-2">
              <i data-lucide="calendar-check" class="w-5 h-5 text-indigo-400"></i>
              <h2 class="text-lg font-bold text-white" x-text="t('card_todos')"></h2>
            </div>
            <p class="text-xs text-gray-400 mt-1" x-text="t('todo_desc')"></p>
          </div>

          <div class="flex items-center space-x-3">
            <!-- 状态筛选按纽组 -->
            <div class="flex items-center bg-brand-dark p-1 rounded-xl border border-brand-border text-xs">
              <button type="button" @click="todoFilter = 'all'" :class="todoFilter === 'all' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition" x-text="t('filter_all')"></button>
              <button type="button" @click="todoFilter = 'pending'" :class="todoFilter === 'pending' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition" x-text="t('filter_pending')"></button>
              <button type="button" @click="todoFilter = 'pending_confirm'" :class="todoFilter === 'pending_confirm' ? 'bg-amber-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition" x-text="t('filter_confirming')"></button>
              <button type="button" @click="todoFilter = 'completed'" :class="todoFilter === 'completed' ? 'bg-indigo-600 text-white font-bold' : 'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded-lg transition" x-text="t('filter_completed')"></button>
            </div>

            <button type="button" @click="openTodoModal()" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-lg shadow-indigo-500/20 flex items-center space-x-2 shrink-0">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span x-text="t('btn_new_todo')"></span>
            </button>
          </div>
        </div>

        <!-- 待办任务列表 -->
        <div class="space-y-4">
          <template x-if="filteredTodos.length === 0">
            <div class="text-center py-16 border border-dashed border-brand-border rounded-2xl">
              <div class="w-12 h-12 rounded-2xl bg-brand-dark/80 text-gray-500 flex items-center justify-center mx-auto mb-3 border border-brand-border">
                <i data-lucide="calendar-x-2" class="w-6 h-6"></i>
              </div>
              <h3 class="text-sm font-semibold text-gray-300" x-text="t('no_todos_title')"></h3>
              <p class="text-xs text-gray-500 mt-1 max-w-md mx-auto" x-text="t('no_todos_desc')"></p>
              <button type="button" @click="openTodoModal()" class="mt-4 px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 hover:text-indigo-300 border border-indigo-500/30 rounded-xl text-xs font-semibold transition inline-flex items-center space-x-1.5">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span x-text="t('btn_new_todo')"></span>
              </button>
            </div>
          </template>

          <template x-for="todo in filteredTodos" :key="todo.id">
            <div class="border rounded-2xl p-5 bg-brand-dark/30 transition-all space-y-4 relative"
                 :class="!todo.is_enabled ? 'opacity-60 border-brand-border' : todo.status === 'pending_confirm' ? 'border-amber-500/60 bg-amber-500/5 ring-1 ring-amber-500/20' : todo.status === 'completed' ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-brand-border hover:border-brand-border/90'">
              
              <!-- 顶部状态栏与标题 -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="space-y-1.5">
                  <div class="flex flex-wrap items-center gap-2">
                    <!-- 状态徽章 -->
                    <template x-if="!todo.is_enabled">
                      <span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-500/10 text-gray-400 border border-gray-500/20 font-medium flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>
                        <span x-text="t('todo_status_disabled')"></span>
                      </span>
                    </template>
                    <template x-if="todo.is_enabled && todo.status === 'completed'">
                      <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span x-text="t('todo_status_completed')"></span>
                      </span>
                    </template>
                    <template x-if="todo.is_enabled && todo.status === 'pending_confirm'">
                      <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold flex items-center space-x-1 animate-pulse">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                        <span x-text="t('todo_status_confirming')"></span>
                      </span>
                    </template>
                    <template x-if="todo.is_enabled && todo.status === 'pending' && todo.is_overdue">
                      <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-semibold flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                        <span x-text="t('todo_status_overdue')"></span>
                      </span>
                    </template>
                    <template x-if="todo.is_enabled && todo.status === 'pending' && !todo.is_overdue">
                      <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                        <span x-text="t('todo_status_pending')"></span>
                      </span>
                    </template>

                    <!-- 执行模式徽章 -->
                    <span class="text-[10px] px-2 py-0.5 rounded-md border font-medium font-mono flex items-center space-x-1"
                          :class="todo.is_recurring ? 'bg-purple-500/10 text-purple-300 border-purple-500/30' : 'bg-slate-500/10 text-slate-300 border-slate-500/30'">
                      <i :data-lucide="todo.is_recurring ? 'repeat' : 'zap'" class="w-3 h-3"></i>
                      <span x-text="todo.is_recurring ? (lang === 'zh' ? `循环 (每 ${todo.repeat_interval_value} ${formatUnitText(todo.repeat_interval_unit)})` : `Recurring (${todo.repeat_interval_value} ${todo.repeat_interval_unit})`) : t('todo_tag_once')"></span>
                    </span>

                    <!-- 确认方式徽章 -->
                    <span class="text-[10px] px-2 py-0.5 rounded-md border font-medium flex items-center space-x-1"
                          :class="todo.confirm_type === 'manual' ? 'bg-amber-500/10 text-amber-300 border-amber-500/30' : 'bg-teal-500/10 text-teal-300 border-teal-500/30'">
                      <i :data-lucide="todo.confirm_type === 'manual' ? 'hand' : 'bot'" class="w-3 h-3"></i>
                      <span x-text="todo.confirm_type === 'manual' ? (lang === 'zh' ? `手动确认 (催办每 ${todo.remind_interval_minutes}m)` : `Manual Confirm (${todo.remind_interval_minutes}m retry)`) : t('todo_tag_auto_confirm')"></span>
                    </span>

                    <!-- 标题 -->
                    <h3 class="text-base font-bold text-white ml-1" x-text="todo.title"></h3>
                  </div>
                </div>

                <!-- 右侧操作栏 -->
                <div class="flex items-center space-x-2.5">
                  <!-- 手动确认完成按钮 (仅在待确认状态或未完成时突出展示) -->
                  <template x-if="todo.status === 'pending_confirm'">
                    <button type="button" @click="completeTodo(todo.id)" class="px-3.5 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-lg shadow-emerald-600/30 active:scale-95">
                      <i data-lucide="check" class="w-4 h-4"></i>
                      <span x-text="t('btn_complete_todo')"></span>
                    </button>
                  </template>

                  <!-- 已完成任务重置激活按纽 -->
                  <template x-if="todo.status === 'completed'">
                    <button type="button" @click="openResetTodoModal(todo)" class="px-3 py-1.5 bg-brand-border hover:bg-brand-border/80 text-indigo-400 hover:text-white rounded-lg text-xs font-medium transition flex items-center space-x-1.5" :title="t('btn_reactivate_todo')">
                      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                      <span x-text="t('btn_reactivate_todo')"></span>
                    </button>
                  </template>

                  <!-- 启用/暂停 Toggle -->
                  <button type="button" @click="toggleTodo(todo.id)" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none"
                          :class="todo.is_enabled ? 'bg-indigo-600' : 'bg-gray-700'" :title="todo.is_enabled ? t('rule_enabled') : t('rule_disabled')">
                    <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                         :class="todo.is_enabled ? 'translate-x-4' : 'translate-x-0'"></div>
                  </button>

                  <!-- 测试触发 Webhook 按钮 -->
                  <button type="button" @click="triggerTestTodo(todo.id)" class="p-1.5 text-gray-400 hover:text-indigo-300 rounded-md hover:bg-indigo-600/10 transition" :title="t('btn_test_todo')">
                    <i data-lucide="play" class="w-4 h-4"></i>
                  </button>

                  <!-- 编辑按钮 -->
                  <button type="button" @click="openTodoModal(todo)" class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-brand-border transition" :title="t('btn_edit')">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>

                  <!-- 删除确认按钮 -->
                  <div x-data="{ confirmDelete: false }" class="relative">
                    <button type="button" x-show="!confirmDelete" @click="confirmDelete = true" class="p-1.5 text-gray-400 hover:text-red-400 rounded-md hover:bg-red-500/10 transition" :title="t('btn_delete')">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <div x-show="confirmDelete" x-cloak class="flex items-center space-x-1 bg-brand-dark border border-red-500/30 rounded px-2 py-1 text-xs">
                      <span class="text-red-400" x-text="lang === 'zh' ? '确定?' : 'Sure?'"></span>
                      <button type="button" @click="deleteTodo(todo.id)" class="text-emerald-400 font-bold hover:underline" x-text="lang === 'zh' ? '是' : 'Yes'"></button>
                      <button type="button" @click="confirmDelete = false" class="text-gray-400 hover:underline ml-1" x-text="lang === 'zh' ? '否' : 'No'"></button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 时间详情与剩余倒计时卡片 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs bg-brand-dark/50 p-4 rounded-xl border border-brand-border/60">
                <!-- 目标时间与倒计时 -->
                <div class="space-y-1.5">
                  <div class="flex items-center space-x-2 text-gray-400">
                    <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i>
                    <span class="font-medium" x-text="t('lbl_target_time') + ':'"></span>
                    <span class="text-white font-mono font-semibold" x-text="todo.target_date"></span>
                  </div>
                  <div class="flex items-center space-x-2 text-gray-400">
                    <i data-lucide="hourglass" class="w-4 h-4 text-amber-400"></i>
                    <span class="font-medium" x-text="t('lbl_remaining_time') + ':'"></span>
                    <span class="font-semibold text-xs px-2 py-0.5 rounded-md"
                          :class="todo.status === 'completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : todo.status === 'pending_confirm' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : todo.is_overdue ? 'bg-rose-500/10 text-rose-300 border border-rose-500/20' : 'bg-blue-500/10 text-blue-300 border border-blue-500/20'"
                          x-text="formatRemainingTime(todo)"></span>
                  </div>
                </div>

                <!-- Webhook 与时间记录 -->
                <div class="space-y-1.5">
                  <div class="flex items-center space-x-2 text-gray-400 truncate">
                    <i data-lucide="link" class="w-4 h-4 text-indigo-400"></i>
                    <span class="font-medium">Webhook:</span>
                    <span class="px-1.5 py-0.2 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[10px] uppercase font-bold" x-text="todo.webhook && todo.webhook.url ? (todo.webhook.method || 'POST') : (lang === 'zh' ? '继承全局' : 'Global')"></span>
                    <span class="truncate text-indigo-300 font-mono" x-text="(todo.webhook && todo.webhook.url) ? todo.webhook.url : (globalWebhook.url || (lang === 'zh' ? '未配置全局 Webhook' : 'No Global Webhook'))"></span>
                  </div>
                  <div class="flex items-center space-x-4 text-gray-500 text-[11px]">
                    <span x-show="todo.created_at" x-text="t('lbl_created_at') + ': ' + todo.created_at"></span>
                    <span x-show="todo.last_trigger_time" x-text="t('lbl_last_trigger') + ': ' + todo.last_trigger_time"></span>
                    <span x-show="todo.completed_at && todo.status === 'completed'" class="text-emerald-400" x-text="t('lbl_completed_at') + ': ' + todo.completed_at"></span>
                  </div>
                </div>
              </div>

              <!-- 待办内容详情 -->
              <template x-if="todo.content && todo.content.trim()">
                <div class="text-xs text-gray-300 bg-brand-dark/30 p-3 rounded-lg border border-brand-border/40 whitespace-pre-wrap font-sans leading-relaxed" x-text="todo.content"></div>
              </template>
            </div>
          </template>
        </div>
      </div>

    </div>

  </main>

  <!-- 模态框 1：Telegram 账号登录 -->
  <div x-show="showLoginModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" @click.self="closeLoginModal()">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <button type="button" @click="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-lg font-bold text-white mb-2 flex items-center space-x-2">
        <i data-lucide="send" class="w-5 h-5 text-indigo-400"></i>
        <span x-text="t('modal_login_title')"></span>
      </h3>
      <p class="text-xs text-gray-400 mb-6" x-text="lang === 'zh' ? '请输入 Telegram API 凭据进行交互式连接，登录凭据将加密保存在本地安全 Session 中。' : 'Please input Telegram API credentials for interactive authorization. Session will be securely stored in the local server.'"></p>

      <div class="space-y-4">
        <!-- 错误提示 -->
        <template x-if="loginError">
          <div class="p-3 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-xs" x-text="loginError"></div>
        </template>

        <!-- 阶段一：配置 API 凭证并发送验证码 -->
        <div x-show="loginStep === 1" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_phone')"></label>
            <input type="text" x-model="loginForm.phone" placeholder="+8613800000000" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">API ID</label>
              <input type="number" x-model.number="loginForm.api_id" placeholder="123456" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">API Hash</label>
              <input type="text" x-model="loginForm.api_hash" placeholder="your_hash" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
            </div>
          </div>
          <button type="button" @click="sendCode()" :disabled="submittingLogin" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg transition font-semibold text-sm flex items-center justify-center space-x-2">
            <span x-show="!submittingLogin" x-text="t('btn_get_code')"></span>
            <span x-show="submittingLogin" class="flex items-center space-x-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              <span x-text="lang === 'zh' ? '连接中...' : 'Connecting...'"></span>
            </span>
          </button>
        </div>

        <!-- 阶段二：输入验证码 -->
        <div x-show="loginStep === 2" class="space-y-4">
          <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-lg text-xs flex items-center space-x-2">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span x-text="lang === 'zh' ? '验证码已成功发往您的 Telegram 客户端。' : 'Verification code has been sent to your Telegram client.'"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_sms_code')"></label>
            <input type="text" x-model="loginForm.code" :placeholder="lang === 'zh' ? '输入验证码' : 'Enter SMS Code'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white tracking-widest text-center font-bold">
          </div>
          <button type="button" @click="verifyCode()" :disabled="submittingLogin" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg transition font-semibold text-sm flex items-center justify-center space-x-2">
            <span x-show="!submittingLogin" x-text="t('btn_verify_code')"></span>
            <span x-show="submittingLogin" class="flex items-center space-x-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              <span x-text="lang === 'zh' ? '验证中...' : 'Verifying...'"></span>
            </span>
          </button>
          <button type="button" @click="loginStep = 1; loginError = ''" class="w-full py-2 bg-transparent text-gray-400 hover:text-white rounded-lg text-xs transition" x-text="lang === 'zh' ? '返回上一步' : 'Go Back'"></button>
        </div>

        <!-- 阶段三：输入两步验证密码 -->
        <div x-show="loginStep === 3" class="space-y-4">
          <div class="p-3 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-lg text-xs flex items-center space-x-2">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <span x-text="lang === 'zh' ? '该账号已启用两步验证 (2FA)，请输入您的账户密码。' : 'This account has 2FA enabled. Please enter your two-step verification password.'"></span>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_2fa_pwd')"></label>
            <input type="password" x-model="loginForm.password" :placeholder="lang === 'zh' ? '输入密码' : 'Enter 2FA Password'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
          </div>
          <button type="button" @click="verify2FA()" :disabled="submittingLogin" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg transition font-semibold text-sm flex items-center justify-center space-x-2">
            <span x-show="!submittingLogin" x-text="t('btn_verify_2fa')"></span>
            <span x-show="submittingLogin" class="flex items-center space-x-2">
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              <span x-text="lang === 'zh' ? '验证中...' : 'Verifying...'"></span>
            </span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- 模态框 2：规则添加/编辑 -->
  <div x-show="showRuleModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" @click.self="closeRuleModal()">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-2xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button type="button" @click="closeRuleModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-lg font-bold text-white mb-6 flex items-center space-x-2">
        <i data-lucide="shield-alert" class="w-5 h-5 text-indigo-400"></i>
        <span x-text="ruleForm.isEdit ? (lang === 'zh' ? '编辑监控规则' : 'Edit Monitoring Rule') : (lang === 'zh' ? '创建监控规则' : 'Create Monitoring Rule')"></span>
      </h3>

      <div class="space-y-5">
        <!-- 规则名称 -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_rule_name')"></label>
          <input type="text" x-model="ruleForm.name" :placeholder="lang === 'zh' ? '例如: 招聘关键字监听' : 'e.g. Job Recruitment Monitor'" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white">
        </div>

        <!-- 绑定执行账号 -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_bind_accounts')"></label>
          <div class="flex flex-wrap gap-3 p-3 bg-brand-dark rounded-lg border border-brand-border">
            <label class="inline-flex items-center space-x-2 text-sm cursor-pointer">
              <input type="checkbox" x-model="ruleForm.bindAll" @change="handleBindAllChange()" class="rounded border-brand-border text-indigo-600 focus:ring-indigo-500 bg-brand-dark">
              <span class="text-indigo-400 font-semibold" x-text="t('lbl_bind_all')"></span>
            </label>
            <template x-for="acc in accounts" :key="acc.phone">
              <label class="inline-flex items-center space-x-2 text-sm cursor-pointer" x-show="!ruleForm.bindAll">
                <input type="checkbox" :value="acc.phone" x-model="ruleForm.accounts" class="rounded border-brand-border text-indigo-600 focus:ring-indigo-500 bg-brand-dark">
                <span x-text="acc.phone"></span>
              </label>
            </template>
          </div>
          <p class="text-[11px] text-gray-500 mt-1" x-text="lang === 'zh' ? '仅勾选的账号会在收到消息时应用此过滤规则。' : 'Only selected accounts will apply this filtering logic upon message arrival.'"></p>
        </div>

        <!-- 监听目标 chats -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_targets_field')"></label>
          <textarea x-model="ruleForm.targetsText" rows="3" placeholder="@job_channel_demo&#10;-100123456789&#10;https://t.me/another_group" class="w-full px-3 py-2 bg-brand-dark border border-brand-border focus:border-indigo-500 focus:outline-none rounded-lg text-sm text-white font-mono"></textarea>
          <p class="text-[11px] text-gray-500 mt-1" x-text="t('targets_hint')"></p>
        </div>

        <!-- 过滤匹配模式 -->
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_filter_mode')"></label>
          <div class="grid grid-cols-2 gap-4">
            <label class="flex items-center justify-between p-3 bg-brand-dark rounded-lg border cursor-pointer transition"
                   :class="ruleForm.filterMode === 'all' ? 'border-indigo-500/50 bg-indigo-500/5 text-white' : 'border-brand-border text-gray-400'">
              <div class="flex items-center space-x-2">
                <input type="radio" value="all" x-model="ruleForm.filterMode" class="text-indigo-600 focus:ring-indigo-500 bg-brand-dark">
                <span class="text-sm font-semibold" x-text="t('rule_filter_all')"></span>
              </div>
            </label>
            <label class="flex items-center justify-between p-3 bg-brand-dark rounded-lg border cursor-pointer transition"
                   :class="ruleForm.filterMode === 'keywords' ? 'border-indigo-500/50 bg-indigo-500/5 text-white' : 'border-brand-border text-gray-400'">
              <div class="flex items-center space-x-2">
                <input type="radio" value="keywords" x-model="ruleForm.filterMode" class="text-indigo-600 focus:ring-indigo-500 bg-brand-dark">
                <span class="text-sm font-semibold" x-text="t('rule_filter_kw')"></span>
              </div>
            </label>
          </div>
        </div>

        <!-- 关键字输入 (按关键字过滤模式时展示) -->
        <div x-show="ruleForm.filterMode === 'keywords'" class="space-y-4 border-l-2 border-indigo-500/30 pl-4 py-1" x-cloak>
          <!-- 匹配关键字 Tag Input -->
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_kw_must')"></label>
            <div class="w-full min-h-[42px] px-3 py-2 bg-brand-dark border border-brand-border rounded-lg flex flex-wrap items-center gap-1.5 focus-within:border-indigo-500">
              <template x-for="(tag, index) in ruleForm.keywords" :key="index">
                <span class="inline-flex items-center px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded text-xs font-medium">
                  <span x-text="tag"></span>
                  <button type="button" @click="ruleForm.keywords.splice(index, 1)" class="ml-1 text-indigo-400 hover:text-indigo-200 focus:outline-none">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </span>
              </template>
              <input type="text" x-model="tempKeyword" @keydown.enter.prevent="if(tempKeyword.trim()){ ruleForm.keywords.push(tempKeyword.trim()); tempKeyword = ''; }" @blur="if(tempKeyword.trim()){ ruleForm.keywords.push(tempKeyword.trim()); tempKeyword = ''; }" :placeholder="lang === 'zh' ? '添加标签...' : 'Add tag...'" class="flex-grow bg-transparent focus:outline-none text-sm text-white min-w-[100px]">
            </div>
          </div>

          <!-- 排除关键字 Tag Input -->
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_kw_exclude')"></label>
            <div class="w-full min-h-[42px] px-3 py-2 bg-brand-dark border border-brand-border rounded-lg flex flex-wrap items-center gap-1.5 focus-within:border-indigo-500">
              <template x-for="(tag, index) in ruleForm.exclude_keywords" :key="index">
                <span class="inline-flex items-center px-2 py-0.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded text-xs font-medium line-through">
                  <span x-text="tag"></span>
                  <button type="button" @click="ruleForm.exclude_keywords.splice(index, 1)" class="ml-1 text-red-400 hover:text-red-200 focus:outline-none">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </span>
              </template>
              <input type="text" x-model="tempExcludeKeyword" @keydown.enter.prevent="if(tempExcludeKeyword.trim()){ ruleForm.exclude_keywords.push(tempExcludeKeyword.trim()); tempExcludeKeyword = ''; }" @blur="if(tempExcludeKeyword.trim()){ ruleForm.exclude_keywords.push(tempExcludeKeyword.trim()); tempExcludeKeyword = ''; }" :placeholder="lang === 'zh' ? '添加排除标签...' : 'Add exclude tag...'" class="flex-grow bg-transparent focus:outline-none text-sm text-white min-w-[100px]">
            </div>
          </div>

          <!-- 排除发送者 Tag Input -->
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_kw_exclude_senders')"></label>
            <div class="w-full min-h-[42px] px-3 py-2 bg-brand-dark border border-brand-border rounded-lg flex flex-wrap items-center gap-1.5 focus-within:border-indigo-500">
              <template x-for="(tag, index) in ruleForm.exclude_senders" :key="index">
                <span class="inline-flex items-center px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded text-xs font-medium line-through">
                  <span x-text="tag.startsWith('@') || /^\d+$/.test(tag) ? tag : '@' + tag"></span>
                  <button type="button" @click="ruleForm.exclude_senders.splice(index, 1)" class="ml-1 text-amber-400 hover:text-amber-200 focus:outline-none">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </span>
              </template>
              <input type="text" x-model="tempExcludeSender" @keydown.enter.prevent="if(tempExcludeSender.trim()){ ruleForm.exclude_senders.push(tempExcludeSender.trim()); tempExcludeSender = ''; }" @blur="if(tempExcludeSender.trim()){ ruleForm.exclude_senders.push(tempExcludeSender.trim()); tempExcludeSender = ''; }" :placeholder="lang === 'zh' ? '添加排除发送者 (如 @username 或 ID)...' : 'Add excluded sender...'" class="flex-grow bg-transparent focus:outline-none text-sm text-white min-w-[150px]">
            </div>
          </div>

          <!-- 正则开关 -->
          <div class="flex items-center justify-between py-2 border-t border-brand-border/40">
            <div>
              <span class="text-xs font-semibold text-gray-300 block" x-text="t('lbl_regex_enable')"></span>
              <span class="text-[10px] text-gray-500" x-text="t('regex_hint')"></span>
            </div>
            <button type="button" @click="ruleForm.use_regex = !ruleForm.use_regex" class="w-10 h-6 flex items-center rounded-full p-0.5 duration-300 transition-colors focus:outline-none"
                    :class="ruleForm.use_regex ? 'bg-indigo-600' : 'bg-gray-700'">
              <div class="bg-white w-5 h-5 rounded-full shadow-md transform duration-300"
                   :class="ruleForm.use_regex ? 'translate-x-4' : 'translate-x-0'"></div>
            </button>
          </div>
        </div>

        <!-- 防抖冷却设置 -->
        <div class="border-t border-brand-border/40 pt-4">
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" x-text="t('lbl_debounce_time')"></label>
          <div class="flex items-center space-x-3">
            <div class="relative flex-grow max-w-[220px]">
              <input type="number" min="0" x-model.number="ruleForm.debounce_seconds" placeholder="0" class="w-full px-3 py-2 bg-brand-dark border border-brand-border rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500 pr-12">
              <span class="absolute right-3 top-2.5 text-xs text-gray-500" x-text="lang === 'zh' ? '秒' : 'Sec'"></span>
            </div>
            <div class="text-xs">
              <template x-if="ruleForm.debounce_seconds > 0">

              <span x-text="t('lbl_http_code')"></span>: <span class="font-bold text-white" x-text="testResult.code || '无'"></span> | <span x-text="lang === 'zh' ? '响应耗时' : 'Latency'"></span>: <span class="font-bold text-white" x-text="testResult.elapsed + ' ms'"></span>
